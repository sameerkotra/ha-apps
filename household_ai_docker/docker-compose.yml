# Household AI on its own machine. Start:   docker compose up -d --build
# Settings page:  http://localhost:8080 on this machine (see ADMIN_PASSWORD below to open it from other computers)
# Household apps: Ollama provider, address http://<this machine's IP address>:11434
services:
  household-ai:
    build:
      context: .
      args:
        OLLAMA_LIBS: all          # "cpu" for a smaller image on a machine without an NVIDIA graphics card
    image: household-ai:local
    container_name: household-ai
    restart: unless-stopped
    ports:
      # The settings page, on this machine only. To open it from other computers, set ADMIN_PASSWORD below first,
      # then change this line to "8080:8080" (README.md, "The settings page").
      - "127.0.0.1:8080:8080"
      - "11434:11434"             # the gateway the household apps use
    environment:
      TZ: "Europe/London"         # your time zone: the daytime window (When models stay loaded) follows it
      PUBLIC_GATEWAY_PORT: "11434"  # change with the left-hand side of the 11434 line above
      ALLOWED_HOSTS: ""           # full names you reach this machine by, e.g. "nas.example.com" (README.md);
                                  # IP addresses, localhost, names without a dot and .local/.lan names always work
      ADMIN_PASSWORD: ""          # the settings page's password (any user name); empty = none, for 127.0.0.1 only
      ALLOW_ANY_REGISTRY: "0"     # "1" lets the page download models from any registry, not only Ollama's and
                                  # Hugging Face's
    volumes:
      - ./data:/data              # settings, keys, usage and the models (gigabytes each)
    # Hardening: no program in the container may gain privileges (Ollama and the app need none), and a stop waits
    # for an answer to end.
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    # More hardening that works on most machines but isn't tested with every Ollama image and graphics card setup
    # (README.md, "Hardening"): remove the # on the lines you want, then `docker compose up -d` and check the
    # Status tab says Ready.
    # cap_drop: [ALL]
    # user: "1000:1000"           # after `sudo chown -R 1000:1000 ./data`, and with HOME: "/data" above
    # An NVIDIA graphics card (needs the NVIDIA Container Toolkit on this machine): remove the # on the next 7 lines.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

# Household AI for the openmediavault-k8s plugin (K3s).
#
# The settings page can be reached at https://ai.<FQDN>:8443
{% set hostname = 'ai.' ~ fqdn() %}
# Alternatively, use sslip.io if you don't have a local DNS server.
# The settings page can then be reached at https://ai.<IP>.sslip.io:8443
# {% set hostname = 'ai.' ~ ipaddr() ~ '.sslip.io' %}
#
# The household apps in Home Assistant use the gateway directly, not through Traefik:
#   Provider: Ollama    Address: http://<this NAS's IP address>:11434
#
# The image isn't on a registry: build it and load it into K3s first (household_ai_docker/k8s/README.md).
#
# Change the following variables to adapt the recipe to your needs.
{% set runAsUser = 'nobody' %}
{% set runAsGroup = 'users' %}
# The settings page's password (any user name). Required: the page is reachable from your whole network.
{% set adminPassword = '<MODIFY>' %}
# Insert the name of the shared folder for settings, keys, usage and the models (gigabytes each).
# Make sure the configured UID/GID the container is running with can write to that directory.
{% set dataSharedFolderName = '<MODIFY>' %}
# The port on the NAS the household apps use. Change it if something else already uses 11434.
{% set gatewayPort = 11434 %}
# The settings page's port inside the pod (only Traefik reaches it; it isn't opened on the NAS).
{% set webPort = 8090 %}
# !!! Only modify the following manifest if you need to make custom changes. !!!
---
apiVersion: v1
kind: Namespace
metadata:
  name: household-ai-app
---
apiVersion: v1
kind: Secret
metadata:
  name: household-ai
  namespace: household-ai-app
  labels:
    app.kubernetes.io/name: household-ai
type: Opaque
stringData:
  ADMIN_PASSWORD: "{{ adminPassword }}"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: household-ai-data
  labels:
    app.kubernetes.io/name: household-ai
spec:
  storageClassName: shared-folder
  capacity:
    storage: 100Gi
  hostPath:
    path: {{ sharedfolder_path(dataSharedFolderName) }}
    type: Directory
  accessModes:
    - ReadWriteOnce
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: household-ai-data
  namespace: household-ai-app
  labels:
    app.kubernetes.io/name: household-ai
spec:
  storageClassName: shared-folder
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  volumeName: household-ai-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: household-ai
  namespace: household-ai-app
  labels:
    app.kubernetes.io/name: household-ai
spec:
  replicas: 1
  # One copy only: the models and the database live in one folder.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: household-ai
      app.kubernetes.io/name: household-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: household-ai
        app.kubernetes.io/name: household-ai
    spec:
      # Gives an answer in progress time to end cleanly.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ uid(runAsUser) }}
        runAsGroup: {{ gid(runAsGroup) }}
      containers:
        - name: household-ai
          # Built locally with Podman and imported into K3s (k3s ctr images import), so never pulled.
          # "localhost/" is the name Podman gives a local build; without it Kubernetes would look for docker.io/….
          image: localhost/household-ai:local
          imagePullPolicy: Never
          ports:
            - name: web
              containerPort: {{ webPort }}
            - name: gateway
              containerPort: 11434
              # Published on the NAS itself, so Home Assistant reaches it at http://<NAS IP>:{{ gatewayPort }}
              # and the page sees each caller's real address.
              hostPort: {{ gatewayPort }}
          env:
            - name: WEB_PORT
              value: "{{ webPort }}"
            - name: TZ
              value: "{{ tz() }}"
            - name: PUBLIC_GATEWAY_PORT
              value: "{{ gatewayPort }}"
            # The page and the gateway only answer to names they know; the sslip.io / FQDN name is added here.
            - name: ALLOWED_HOSTS
              value: "{{ hostname }}"
            - name: ALLOW_ANY_REGISTRY
              value: "0"
            # Ollama keeps a small file in its home folder; the container's user has none of its own.
            - name: HOME
              value: /data
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: household-ai
                  key: ADMIN_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
          # /api/health answers without the password.
          startupProbe:
            httpGet:
              path: /api/health
              port: web
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/health
              port: web
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          # Models need a lot of memory. To keep Household AI from starving the NAS, set a limit here, e.g.
          # resources:
          #   limits:
          #     memory: 8Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: household-ai-data
---
apiVersion: v1
kind: Service
metadata:
  name: household-ai
  namespace: household-ai-app
  labels:
    app.kubernetes.io/name: household-ai
spec:
  selector:
    app.kubernetes.io/instance: household-ai
    app.kubernetes.io/name: household-ai
  ports:
    - name: web
      port: {{ webPort }}
      targetPort: web
    - name: gateway
      port: 11434
      targetPort: gateway
---
# The settings page through Traefik (HTTPS on 8443).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: household-ai-websecure
  namespace: household-ai-app
  labels:
    app.kubernetes.io/name: household-ai
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ hostname }}`)
      kind: Rule
      services:
        - name: household-ai
          port: {{ webPort }}
  tls: {}

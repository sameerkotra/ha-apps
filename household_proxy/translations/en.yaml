configuration:
  admin_users:
    name: Admins
    description: >-
      Home Assistant user names (login names) or user ids of the app's admins
      — display names are not accepted. Admins add the sites, choose who may
      open each one and set up checks and restarts (Admin). Admins open every
      site. Empty by default: until you add someone, every page shows "No
      admin yet". Not sure what to enter? Open the app and select your name:
      "How the app sees you" shows the exact value. Restart the app
      (Information tab → Restart) after changing this list.

configuration:
  admin_users:
    name: Admin users
    description: >-
      Home Assistant user names or user ids (not display names) of the people who
      manage Household Docs: who has access, the documents folder, App settings and
      backups. Admins can't open anyone's documents as admins. Empty by default:
      nobody is an admin until you list at least one name here. Restart the app
      after changing it (Information tab → Restart).

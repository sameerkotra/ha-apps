<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Insights</title>
  <script src="static/common/theme-boot.js"></script>
  <link rel="stylesheet" href="static/common/themes.css">
  <link rel="stylesheet" href="static/app.css">
</head>
<body class="pg-analysis">
  <div class="page mid">
    <div class="topbar">
      <div class="grow">
        <h1>Insights</h1>
        <div class="sub" id="homeLine">Spending, prices and savings</div>
      </div>
      <span id="homeSwitch"></span>
      <details class="menu" id="pageMenu">
        <summary class="icon-btn" id="pageMenuBtn" aria-label="More actions" title="More actions"></summary>
        <div class="menu-list"><button type="button" id="exportBtn"></button></div>
      </details>
    </div>

    <div class="controls">
      <div class="seg" id="tabs" role="tablist" aria-label="Analysis sections"></div>
      <div class="seg" id="ranges" role="group" aria-label="Period"></div>
    </div>

    <div id="content" class="stack" aria-live="polite"></div>
  </div>

  <script src="static/common/backnav.js"></script>
  <script src="static/common/ui.js"></script>
  <script src="static/app.js"></script>
  <script src="static/pages/analysis.js"></script>
</body>
</html>

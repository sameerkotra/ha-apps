<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Review receipt</title>
  <script src="static/common/theme-boot.js"></script>
  <link rel="stylesheet" href="static/common/themes.css">
  <link rel="stylesheet" href="static/app.css">
</head>
<body class="pg-review">
  <div class="page" id="page">
    <div class="topbar stacked" id="topbar"></div>
    <div id="fatal" hidden></div>
    <div class="layout" id="layout" hidden>
      <aside class="viewer" id="viewer"></aside>
      <main class="stack" id="editor"></main>
    </div>
    <div class="stack" id="skeleton">
      <div class="skeleton" style="height:56px"></div><div class="skeleton" style="height:180px"></div><div class="skeleton" style="height:260px"></div>
    </div>
  </div>

  <div class="actionbar" id="actionbar" hidden>
    <div class="actionbar-inner">
      <div class="summary"><div class="total" id="sumTotal"></div><div class="meta" id="sumMeta"></div></div>
      <button class="btn" id="saveBtn" hidden>Save</button>
      <button class="btn btn-primary" id="approveBtn">Approve &amp; save</button>
    </div>
  </div>

  <datalist id="chains"></datalist>
  <script src="static/common/backnav.js"></script>
  <script src="static/common/ui.js"></script>
  <script src="static/app.js"></script>
  <script src="static/pages/review.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stores</title>
  <script src="static/common/theme-boot.js"></script>
  <link rel="stylesheet" href="static/common/themes.css">
  <link rel="stylesheet" href="static/app.css">
</head>
<body class="pg-stores">
  <div class="page mid">
    <div class="topbar">
      <div class="grow">
        <h1>Stores</h1>
        <div class="sub" id="homeLine">Names, addresses and chains</div>
      </div>
      <span id="homeSwitch"></span>
    </div>
    <div id="dupes" class="dupes"></div>
    <div id="dirTools" class="dirtools" hidden></div>
    <div id="content" class="stack" aria-live="polite"></div>
    <!-- Nearby stores, websites and opening hours: tools used now and then, folded under the directory -->
    <details class="tools" id="toolsCard">
      <summary>Tools <span class="muted small">nearby stores · websites · opening hours</span></summary>
      <div class="stack tools-body">
        <div id="nearbyBox"></div>
        <div id="sitesBox"></div>
        <div id="webBox"></div>
      </div>
    </details>
  </div>

  <script src="static/common/backnav.js"></script>
  <script src="static/common/ui.js"></script>
  <script src="static/app.js"></script>
  <script src="static/pages/stores.js"></script>
</body>
</html>

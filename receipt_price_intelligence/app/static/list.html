<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shopping list</title>
  <script src="static/common/theme-boot.js"></script>
  <link rel="stylesheet" href="static/common/themes.css">
  <link rel="stylesheet" href="static/app.css">
  <style>
    .addbar { display: grid; grid-template-columns: 1fr auto; gap: 8px; position: relative; }
    .suggest { position: absolute; top: 100%; left: 0; right: 0; z-index: 20; margin-top: 4px; background: var(--surface);
               border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-height: 50vh; overflow: auto; }
    .suggest button { display: flex; justify-content: space-between; width: 100%; text-align: left; padding: 10px 12px; border: 0;
                      background: none; color: var(--text); font: inherit; cursor: pointer; }
    .suggest button:hover, .suggest button.hl { background: var(--surface-2); }
    .suggest .new { color: var(--muted); font-style: italic; }
    .litem { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
    .litem:first-child { border-top: 0; }
    .litem input[type=checkbox] { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--accent); }
    .litem .body { flex: 1 1 auto; min-width: 0; }
    .litem .nm { font-weight: 600; overflow-wrap: anywhere; }
    .litem.done .nm { text-decoration: line-through; color: var(--muted); }
    .litem .where { font-size: .82rem; margin-top: 2px; }
    .litem .where b { color: var(--accent); }
    .litem .also { font-size: .74rem; color: var(--muted); }
    .litem .ctl { display: flex; gap: 6px; align-items: center; flex: none; }
    .qty { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
    .qty button { width: 28px; height: 30px; border: 0; background: var(--surface-2); color: var(--text); font-size: 1rem; cursor: pointer; }
    .qty span { min-width: 30px; text-align: center; line-height: 30px; font-variant-numeric: tabular-nums; font-size: .85rem; }
    .rm { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); color: var(--danger); cursor: pointer; flex: none; }
    .src { font-size: .66rem; font-weight: 700; padding: 1px 6px; border-radius: 8px; margin-left: 4px; vertical-align: middle; }
    .src.online, .src.deal { background: var(--info-soft, rgba(52,120,246,.12)); color: var(--info, #3478f6); }
    .src.receipt { background: var(--surface-3, rgba(127,127,127,.15)); color: var(--muted); }
    .grp-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 4px 0; }
    .grp-h h3 { margin: 0; font-size: 1rem; }
    .pickrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
    .pickrow input { width: 20px; height: 20px; accent-color: var(--accent); }
    .pickrow .on { font-size: .72rem; color: var(--muted); margin-left: auto; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tabs button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
    code { font-size: .8rem; background: var(--surface-2); padding: 1px 5px; border-radius: 6px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="page mid">
    <div class="topbar">
      <div class="grow"><h1>Shopping list</h1><div class="sub">Where each item is cheapest now</div></div>
      <span id="homeSwitch"></span>
    </div>
    <div id="content" class="stack" aria-live="polite"></div>
  </div>

  <script src="static/common/backnav.js"></script>
  <script src="static/common/ui.js"></script>
  <script src="static/app.js"></script>
  <script src="static/pages/list.js"></script>
</body>
</html>

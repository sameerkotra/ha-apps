<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trip planner</title>
  <script src="static/common/theme-boot.js"></script>
  <link rel="stylesheet" href="static/common/themes.css">
  <link rel="stylesheet" href="static/app.css">
  <style>
    .sect { font-size: .78rem; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 6px 2px 0; }
    .note { font-size: .82rem; color: var(--muted); }
    .row-between { display: flex; align-items: center; gap: 10px; }
    .grow { flex: 1; min-width: 0; }
    .status-pill { display: inline-flex; align-items: center; gap: 6px; }
    .car { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
    .car[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft, rgba(15,157,107,.08)); }
    .car .meta { font-size: .82rem; color: var(--muted); }
    .car b { display: block; }
    .cars { display: grid; gap: 8px; }
    /* the plan: which price each item uses */
    .irow { padding: 8px 0; border-top: 1px solid var(--line); display: grid; gap: 4px; }
    .itop { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .iname { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
    .icost { flex: none; font-variant-numeric: tabular-nums; }
    .used { display: inline-block; margin-left: 6px; font-size: .68rem; font-weight: 700; padding: 1px 7px; border-radius: 9px; vertical-align: middle; }
    .used.on { background: var(--info-soft, rgba(52,120,246,.12)); color: var(--info, #3478f6); }
    .used.rc { background: var(--surface-3, rgba(127,127,127,.15)); color: var(--muted); }
    .used.bad { background: var(--warn-soft, rgba(230,160,0,.14)); color: var(--warn, #b7791f); }
    .chips2 { display: flex; flex-wrap: wrap; gap: 6px; }
    .pchip { display: inline-flex; align-items: baseline; gap: 5px; padding: 3px 8px; border-radius: 8px; border: 1px solid var(--line);
             font-size: .8rem; color: var(--muted); background: var(--surface); }
    .pchip .k { font-size: .68rem; text-transform: uppercase; letter-spacing: .03em; font-weight: 700; }
    .pchip .x { font-size: .72rem; }
    .pchip.chosen { color: var(--text); border-color: var(--accent); background: var(--accent-soft, rgba(15,157,107,.08)); }
    .pchip.chosen.online .k, .pchip.chosen.deal .k { color: var(--info, #3478f6); }
    .pchip .tick { color: var(--accent); font-weight: 800; }
    .pchip.none { border-style: dashed; font-size: .74rem; }
    .pchip.disc { border-color: var(--accent); }
    .linkbtn { border: 0; background: none; padding: 2px 0; color: var(--accent); font: inherit; font-size: .76rem; text-decoration: underline; cursor: pointer; }
    .iwhy { font-size: .76rem; color: var(--muted); overflow-wrap: anywhere; }
    .iwhy a { color: inherit; text-decoration: underline; }
    .oppanel { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; background: var(--surface-2); }
    .op-big { font-size: 1rem; } .op-big b { font-size: 1.15rem; }
    .op-row { display: flex; flex-wrap: wrap; gap: 6px; } .op-row .used { margin-left: 0; font-size: .74rem; }
    .cmp { border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 6px; }
    .cmp-h { font-weight: 650; }
    .cmp-r { display: grid; gap: 4px; padding: 6px 8px; border-radius: 10px; }
    .cmp-r.chosen { background: var(--accent-soft, rgba(15,157,107,.08)); }
    .cmp-s { font-size: .85rem; font-weight: 600; }
    .picked { display: grid; gap: 8px; }
    .pick { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    /* The name column gives way (min-width: 0) so the quantity and the remove button always stay on screen */
    .pick .grow { flex: 1 1 auto; min-width: 0; }
    .pick .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pick .unit { font-size: .76rem; color: var(--muted); overflow-wrap: anywhere; }
    .pick .stepper, .pick .remove { flex: none; }
    .pick .remove { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 10px; color: var(--danger, #c0392b); background: var(--surface-2); }
    .pick .remove:hover { background: var(--danger-soft, rgba(192,57,43,.12)); }
    @media (max-width: 380px) { .pick { gap: 6px; padding: 8px 10px; } .stepper button { width: 30px; } .stepper input { width: 38px; } }
    .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .stepper button { width: 34px; height: 34px; border: 0; background: var(--surface-2); color: var(--text); font-size: 1.1rem; cursor: pointer; }
    .stepper input { width: 46px; height: 34px; border: 0; text-align: center; background: transparent; color: var(--text); font-size: .95rem; -moz-appearance: textfield; }
    .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip-btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 5px 12px; font-size: .85rem; cursor: pointer; }
    .chip-btn:hover { background: var(--surface-2); }
    .search { position: relative; }
    .search svg { position: absolute; left: 12px; top: 11px; width: 20px; height: 20px; color: var(--faint); }
    .search .input { padding-left: 40px; }
    .big { min-height: 52px; font-size: 1.05rem; }

    .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    @media (min-width: 560px) { .metrics { grid-template-columns: repeat(4, 1fr); } }
    .metric { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
    .metric b { display: block; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .metric span { font-size: .75rem; color: var(--muted); }
    .metric.total b { color: var(--accent); }

    .route { position: relative; display: grid; gap: 0; }
    .step { display: grid; grid-template-columns: 34px 1fr; gap: 10px; }
    .dot { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .85rem; flex: none; }
    .dot.home { background: var(--surface-3); color: var(--text); }
    .dot svg { width: 16px; height: 16px; }
    .rail { display: flex; flex-direction: column; align-items: center; }
    .rail i { flex: 1; width: 2px; background: var(--line); margin: 2px 0; min-height: 12px; }
    .leg { font-size: .8rem; color: var(--muted); padding: 2px 0 8px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
    .leg a { text-decoration: underline; }
    .stopbox { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
    .stopbox h3 { font-size: 1rem; margin: 0 0 2px; }
    .li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); font-size: .9rem; }
    .li:first-of-type { border-top: 0; }
    .li .r { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
    .li small { color: var(--muted); display: block; font-weight: 400; }
    .subtotal { display: flex; justify-content: space-between; padding-top: 6px; border-top: 1px solid var(--line); font-weight: 700; font-size: .9rem; }
    .map { width: 100%; height: auto; background: var(--surface-2); border-radius: 12px; display: block; }
    .map .line { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; opacity: .9; }
    .map .straight { stroke-dasharray: 6 5; opacity: .6; }
    .map circle.s { fill: var(--accent); } .map circle.h { fill: var(--text); }
    .map text { fill: #fff; font-size: 11px; font-weight: 700; text-anchor: middle; dominant-baseline: central; font-family: var(--font); }
    .map text.lbl { fill: var(--text); font-weight: 600; font-size: 10.5px; text-anchor: start; }
    .alt { display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: .9rem; }
    .alt:first-child { border-top: 0; }
    .alt .r { text-align: right; font-variant-numeric: tabular-nums; }
    .progress { padding: 16px; display: grid; gap: 8px; }
    dialog.wide { max-width: min(520px, calc(100vw - 20px)); }
    dialog.wide .dialog-body { max-height: 74vh; overflow: auto; }
  </style>
</head>
<body>
  <div class="page mid">
    <div class="topbar">
      <div class="grow">
        <h1>Trip planner</h1>
        <div class="sub" id="homeLine">Where to shop, and the route to drive</div>
      </div>
      <span id="homeSwitch"></span>
    </div>
    <div id="content" class="stack" aria-live="polite"></div>
  </div>

  <script src="static/common/backnav.js"></script>
  <script src="static/common/ui.js"></script>
  <script src="static/app.js"></script>
  <script src="static/pages/trip.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin</title>
  <script>
  (function () {
    var THEMES = ["midnight", "slate", "daylight"];
    try {
      var theme = localStorage.getItem("theme");
      if (theme && THEMES.indexOf(theme) !== -1) document.documentElement.setAttribute("data-theme", theme);
      if (localStorage.getItem("sidebarCollapsed") === "1") document.documentElement.setAttribute("data-sidebar", "collapsed");
    } catch (e) { /* localStorage unavailable (private mode, some webviews) */ }
  })();
  </script>
  <link rel="stylesheet" href="static/app.css">
  <style>
    .group { scroll-margin-top: 12px; }
    .group h2 { font-size: 1.02rem; margin-bottom: 2px; }
    .group > .card-body > .muted { font-size: .85rem; margin-bottom: 12px; }
    .setting { display: grid; gap: 4px; padding: 12px 0; border-top: 1px solid var(--line); }
    .setting:first-of-type { border-top: 0; }
    .setting .label { font-weight: 600; }
    .setting .help { font-size: .8rem; color: var(--muted); line-height: 1.45; max-width: 70ch; overflow-wrap: anywhere; }
    .setting .input, .setting .select { max-width: 460px; }
    .setting.num .input { max-width: 160px; }
    .setting .check { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
    .setting .check input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--accent); flex: none; }
    .setting .secret-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .setting .changed { color: var(--warn); font-size: .75rem; font-weight: 700; margin-left: 6px; }
    .jump { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .jump a { font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
    .jump a:hover { color: var(--text); }
    .savebar { position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); z-index: 5;
               display: flex; gap: 10px; align-items: center; justify-content: flex-end; padding: 10px 14px; margin-top: 14px;
               background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 12px;
               -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    .savebar .note { flex: 1; font-size: .85rem; color: var(--muted); }
    .mrow { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .mrow .input { min-height: 38px; }
    .mrow .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    code { font-family: var(--mono); font-size: .85em; background: var(--surface-2); padding: 1px 5px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="page mid">
    <div class="topbar">
      <div class="grow"><h1>Admin</h1><div class="sub" id="sub">App settings</div></div>
    </div>
    <div id="adminTabs"></div>
    <div id="content" class="stack" aria-live="polite"></div>
  </div>

  <script src="static/backnav.js"></script>
  <script src="static/app.js"></script>
  <script>
    const { h, icon, api, toast, confirmDialog } = RPI;
    const $ = (id) => document.getElementById(id);
    let me = null;

    function tab() { return location.hash === '#homes' ? 'homes' : 'settings'; }
    function showTabs() {
      const nav = RPI.adminTabs(tab());
      const old = document.querySelector('.admin-tabs') || $('adminTabs');
      old.replaceWith(nav);
      $('sub').textContent = tab() === 'homes' ? 'Homes and people' : 'App settings';
    }
    window.addEventListener('hashchange', () => { showTabs(); render(); });

    function denied() {
      $('content').replaceChildren(h('div', { class: 'empty' }, icon('info'), h('h2', {}, 'Administrators only'),
        h('p', {}, 'Administrators are the people on the app’s admin_users option (Configuration tab). ',
          h('a', { href: 'whoami.html', style: 'text-decoration:underline' }, 'How the app sees you'))));
    }

    async function render() {
      if (!me) {
        try { me = await RPI.me(); } catch (e) { return $('content').replaceChildren(h('p', { class: 'form-error' }, e.message)); }
      }
      if (!me.is_admin) return denied();
      if (tab() === 'homes') return renderHomes();
      return renderSettings();
    }

    // ---------- App settings ----------
    let data = null, edits = {};
    function current(key) { return key in edits ? edits[key] : data.values[key]; }

    function control(key, m) {
      const set = (v) => { if (JSON.stringify(v) === JSON.stringify(data.values[key]) && m.kind !== 'secret') delete edits[key]; else edits[key] = v; mark(); };
      if (m.kind === 'bool') {
        const cb = h('input', { type: 'checkbox', checked: !!current(key) });
        cb.addEventListener('change', () => set(cb.checked));
        return h('label', { class: 'check' }, cb, h('span', {}, h('span', { class: 'label' }, m.label), changedTag(key), m.help ? h('span', { class: 'help', style: 'display:block' }, m.help) : null));
      }
      let input;
      if (m.kind === 'choice') {
        input = h('select', { class: 'select', 'aria-label': m.label }, m.choices.map((c) => h('option', { value: c.value }, c.label)));
        input.value = current(key);
        input.addEventListener('change', () => set(input.value));
      } else if (m.kind === 'secret') {
        const isSet = data.secretsSet[key] && edits[key] !== '';
        input = h('input', { class: 'input', type: 'password', autocomplete: 'new-password', placeholder: isSet ? 'Set (type to replace)' : 'Not set', 'aria-label': m.label });
        input.value = key in edits ? edits[key] : '';
        input.addEventListener('input', () => { if (input.value) edits[key] = input.value; else delete edits[key]; mark(); });
        const clear = isSet ? h('button', { type: 'button', class: 'btn btn-sm btn-ghost', onclick: () => { edits[key] = ''; input.value = ''; paint(); } }, 'Clear') : null;
        return [h('span', { class: 'label' }, m.label, changedTag(key)), h('div', { class: 'secret-row' }, input, clear), m.help ? h('span', { class: 'help' }, m.help) : null];
      } else {
        const numeric = m.kind === 'int' || m.kind === 'float';
        input = h('input', { class: 'input', type: numeric ? 'number' : 'text', 'aria-label': m.label, inputmode: numeric ? (m.kind === 'int' ? 'numeric' : 'decimal') : null,
          step: m.kind === 'float' ? 'any' : (m.kind === 'int' ? '1' : null), min: m.min ?? null, max: m.max ?? null, spellcheck: 'false' });
        input.value = current(key);
        input.addEventListener('input', () => {
          if (!numeric) return set(input.value);
          const n = input.value.trim() === '' ? NaN : Number(input.value);
          edits[key] = Number.isFinite(n) ? (m.kind === 'int' && Number.isInteger(n) ? n : (m.kind === 'float' ? n : input.value)) : input.value;
          if (edits[key] === data.values[key]) delete edits[key];
          mark();
        });
      }
      const range = m.min != null && m.max != null ? ` (${m.min}–${m.max})` : '';
      return [h('span', { class: 'label' }, m.label, changedTag(key)), input, m.help || range ? h('span', { class: 'help' }, (m.help || '') + range) : null];
    }
    function changedTag(key) { return h('span', { class: 'changed', dataset: { key }, hidden: !(key in edits) }, 'changed'); }
    function mark() {
      document.querySelectorAll('.changed').forEach((el) => { el.hidden = !(el.dataset.key in edits); });
      const n = Object.keys(edits).length;
      const bar = $('savebar');
      if (bar) {
        bar.hidden = !n;
        bar.querySelector('.note').textContent = `${n} unsaved change${n === 1 ? '' : 's'}`;
      }
    }

    function paint() {
      const byGroup = {};
      for (const [key, m] of Object.entries(data.meta)) (byGroup[m.group] = byGroup[m.group] || []).push([key, m]);
      const jump = h('div', { class: 'jump' }, data.groups.map((g) => h('a', { href: '#g-' + g.id, onclick: (e) => { e.preventDefault(); document.getElementById('g-' + g.id).scrollIntoView({ behavior: 'smooth' }); } }, g.label)));
      const groups = data.groups.map((g) => h('section', { class: 'card group', id: 'g-' + g.id }, h('div', { class: 'card-body' },
        h('h2', {}, g.label), g.help ? h('p', { class: 'muted' }, g.help) : null,
        ...(byGroup[g.id] || []).map(([key, m]) => h('div', { class: 'setting' + (m.kind === 'int' || m.kind === 'float' ? ' num' : '') }, control(key, m))))));
      const save = h('button', { class: 'btn btn-primary', type: 'button', onclick: doSave }, icon('check'), 'Save');
      const undo = h('button', { class: 'btn btn-ghost', type: 'button', onclick: () => { edits = {}; paint(); } }, 'Undo changes');
      const intro = h('p', { class: 'muted small' }, 'Settings for everyone using the app. They apply as soon as they are saved. Who is an administrator is set on the app’s Configuration tab (admin_users).');
      $('content').replaceChildren(intro, jump, ...groups, h('div', { class: 'savebar', id: 'savebar' }, h('span', { class: 'note' }), undo, save));
      mark();
    }

    async function doSave() {
      const body = { ...edits };
      try {
        data = await api('api/admin/settings', { method: 'PUT', body });
        edits = {};
        toast('Settings saved', 'success');
        paint();
      } catch (e) { toast(e.message, 'error'); }
    }

    async function renderSettings() {
      $('content').replaceChildren(...[0, 1, 2].map(() => h('div', { class: 'skeleton', style: 'height:160px' })));
      try { data = await api('api/admin/settings'); } catch (e) { return $('content').replaceChildren(h('p', { class: 'form-error' }, e.message)); }
      edits = {};
      paint();
    }
    window.addEventListener('beforeunload', (e) => { if (Object.keys(edits).length) { e.preventDefault(); e.returnValue = ''; } });

    // ---------- Homes and people ----------
    async function renderHomes() {
      const c = $('content');
      let hs, users;
      try { [hs, users] = await Promise.all([api('api/v1/homes'), api('api/v1/users')]); }
      catch (e) { return c.replaceChildren(h('p', { class: 'form-error' }, e.message)); }
      const act = async (fn, done) => { try { await fn(); toast(done, 'success'); } catch (e) { toast(e.message, 'error'); } renderHomes(); };
      const newName = h('input', { class: 'input', placeholder: 'New home name', 'aria-label': 'New home name', maxlength: '255' });
      const homeRows = hs.map((x) => {
        const inp = h('input', { class: 'input', value: x.name, 'aria-label': 'Home name', maxlength: '255' });
        const used = x.receipt_count + x.pending_count;
        return h('div', { class: 'mrow' }, inp,
          h('button', { class: 'btn btn-sm', onclick: () => act(() => api('api/v1/homes/' + x.id, { method: 'PATCH', body: { name: inp.value } }), 'Renamed') }, 'Save'),
          h('button', { class: 'btn btn-sm btn-danger', disabled: used > 0, title: used ? 'This home has receipts' : 'Delete home', 'aria-label': 'Delete home',
            onclick: async () => { if (await confirmDialog({ title: `Delete “${x.name}”?`, confirmLabel: 'Delete', danger: true })) act(() => api('api/v1/homes/' + x.id, { method: 'DELETE' }), 'Deleted'); } }, icon('trash')));
      });
      c.replaceChildren(
        h('section', { class: 'card' }, h('div', { class: 'card-body stack' },
          h('div', {}, h('h2', { style: 'font-size:1.02rem' }, 'Homes'),
            h('p', { class: 'muted small' }, 'Receipts, prices and lists are kept per home. Everyone can view and add to every home.')),
          h('div', {}, ...homeRows,
            h('div', { class: 'mrow' }, newName,
              h('button', { class: 'btn btn-sm btn-primary', onclick: () => act(() => api('api/v1/homes', { method: 'POST', body: { name: newName.value } }), 'Home created') }, icon('plus'), 'Add'))))),
        h('section', { class: 'card' }, h('div', { class: 'card-body stack' },
          h('div', {}, h('h2', { style: 'font-size:1.02rem' }, 'People'),
            h('p', { class: 'muted small' }, 'Everyone who has opened the app. Administrators are set with admin_users on the app’s Configuration tab (a Home Assistant user name or user id per line), then a restart.')),
          h('div', { class: 'kv' }, users.map((u) => h('div', { class: 'kv-row' },
            h('span', { class: 'k' }, (u.display_name || u.id) + (u.id === me.id ? ' (you)' : '')),
            h('span', { class: 'v' }, u.is_admin ? 'Administrator' : 'Member')))))));
    }

    showTabs();
    render();
  </script>
</body>
</html>

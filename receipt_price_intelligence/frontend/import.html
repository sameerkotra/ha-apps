<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Upload several receipts</title>
  <script>
  (function () {
    var THEMES = ["midnight", "slate", "daylight"];
    try {
      var theme = localStorage.getItem("theme");
      if (theme && THEMES.indexOf(theme) !== -1) document.documentElement.setAttribute("data-theme", theme);
      if (localStorage.getItem("sidebarCollapsed") === "1") document.documentElement.setAttribute("data-sidebar", "collapsed");
    } catch (e) { /* localStorage unavailable (private mode, some webviews) */ }
  })();
  </script>
  <link rel="stylesheet" href="static/app.css">
  <style>
    .drop { border: 2px dashed var(--line); border-radius: 14px; padding: 26px 16px; text-align: center; color: var(--muted); cursor: pointer; background: var(--surface); }
    .drop.over { border-color: var(--accent); background: var(--accent-soft, rgba(15,157,107,.08)); }
    .drop svg { width: 30px; height: 30px; color: var(--faint); }
    .files { display: grid; gap: 6px; }
    .file { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    .file .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: .92rem; }
    .file .meta { font-size: .78rem; color: var(--muted); white-space: nowrap; }
    .file a { text-decoration: underline; }
    .err { color: var(--danger); }
  </style>
</head>
<body>
  <div class="page narrow">
    <div class="topbar">
      <a class="back" href="index.html" id="backLink"></a>
      <div class="grow"><h1>Upload several receipts</h1><div class="sub" id="homeLine"></div></div>
      <span id="homeSwitch"></span>
    </div>
    <div id="content" class="stack" aria-live="polite"></div>
  </div>

  <script src="static/backnav.js"></script>
  <script src="static/app.js"></script>
  <script>
    const { h, icon, api, toast } = RPI;
    const $ = (id) => document.getElementById(id);
    $('backLink').append(icon('back'), 'Receipts');

    const MAX_FILES = 30, BATCH = 6;
    let ctx = null, files = [], busy = false, results = new Map();
    const size = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
    const okType = (f) => f.type.startsWith('image/') || f.type === 'application/pdf' || /\.(pdf|jpe?g|png|webp|gif|heic)$/i.test(f.name);

    function add(list) {
      for (const f of list) {
        if (!okType(f)) { toast(`${f.name} is not a photo or PDF`, 'error'); continue; }
        if (files.length >= MAX_FILES) { toast(`Up to ${MAX_FILES} files at a time`, 'error'); break; }
        if (!files.some((x) => x.name === f.name && x.size === f.size)) files.push(f);
      }
      render();
    }

    async function upload() {
      if (busy || !files.length) return;
      busy = true; results = new Map(); render();
      for (let i = 0; i < files.length; i += BATCH) {
        const batch = files.slice(i, i + BATCH);
        const form = new FormData();
        form.append('home_id', ctx.homeId);
        for (const f of batch) form.append('files', f, f.name);
        try {
          const r = await api('api/v1/import/upload', { method: 'POST', form });
          r.results.forEach((res, k) => results.set(batch[k], res));
        } catch (e) { for (const f of batch) results.set(f, { error: e.message }); }
        render();
      }
      busy = false; render();
      const added = [...results.values()].filter((r) => r.draft_id).length;
      toast(`${added} of ${files.length} added. They are being read.`, added ? 'success' : 'error');
    }

    function render() {
      const input = h('input', { type: 'file', multiple: true, accept: 'image/*,application/pdf', hidden: true });
      input.addEventListener('change', () => { add([...input.files]); input.value = ''; });
      const drop = h('div', { class: 'drop', role: 'button', tabindex: '0', onclick: () => input.click() },
        icon('upload'), h('div', { style: 'font-weight:650;color:var(--text);margin-top:6px' }, 'Choose photos or PDFs'),
        h('div', { class: 'small' }, 'or drop them here. Each photo becomes one receipt; each PDF becomes one receipt with a page per image.'), input);
      drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
      drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('over'));
      drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); add([...e.dataTransfer.files]); });

      const done = files.length && files.every((f) => results.has(f));
      const rows = files.map((f) => {
        const r = results.get(f);
        return h('div', { class: 'file' }, icon(f.type === 'application/pdf' ? 'file' : 'image'), h('span', { class: 'name' }, f.name),
          r ? (r.draft_id ? h('a', { class: 'meta', href: 'review.html?id=' + encodeURIComponent(r.draft_id) }, 'Open') : h('span', { class: 'meta err', title: r.error }, 'Failed'))
            : h('span', { class: 'meta' }, busy ? 'Waiting…' : size(f.size)),
          !busy && !r ? h('button', { class: 'icon-btn', type: 'button', 'aria-label': `Remove ${f.name}`, onclick: () => { files = files.filter((x) => x !== f); render(); } }, icon('x')) : null);
      });
      const failures = files.filter((f) => results.get(f) && !results.get(f).draft_id);
      const c = $('content');
      c.replaceChildren(...[
        drop,
        files.length ? h('div', { class: 'files' }, ...rows) : null,
        failures.length ? h('div', { class: 'banner warn' }, icon('alert'), h('div', { class: 'banner-body' }, h('ul', { class: 'small', style: 'margin-left:16px' },
          failures.map((f) => h('li', {}, `${f.name}: ${results.get(f).error}`))))) : null,
        files.length && !done ? h('button', { class: 'btn btn-primary btn-block', type: 'button', disabled: busy, onclick: upload }, icon('upload'), busy ? 'Uploading…' : `Upload ${files.length} file${files.length === 1 ? '' : 's'}`) : null,
        done ? h('a', { class: 'btn btn-primary btn-block', href: 'index.html' }, 'Go to receipts to review them') : null,
        h('p', { class: 'small muted' }, 'The model reads them one after another. You can leave this page; they appear under To review as they finish, and nothing is added to your history until you approve each one.'),
      ].filter(Boolean));
    }

    async function init() {
      try { ctx = await RPI.homeContext(); } catch (e) { return $('content').replaceChildren(h('div', { class: 'banner danger' }, icon('alert'), h('div', { class: 'banner-body' }, e.message))); }
      if (!ctx.homeId) return $('content').replaceChildren(h('div', { class: 'empty' }, icon('home'), h('h2', {}, 'No home yet'), h('p', {}, 'Create a home from the receipts page first.')));
      const sw = RPI.homeSwitcher(ctx.homes, ctx.homeId, (id) => { ctx.homeId = id; paint(); });
      $('homeSwitch').replaceChildren(...(sw ? [sw] : []));
      paint(); render();
    }
    function paint() { const home = ctx.homes.find((x) => x.id === ctx.homeId); $('homeLine').textContent = home ? `Adding to ${home.name}` : ''; }
    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Review receipt</title>
  <script>
  (function () {
    var THEMES = ["midnight", "slate", "daylight"];
    try {
      var theme = localStorage.getItem("theme");
      if (theme && THEMES.indexOf(theme) !== -1) document.documentElement.setAttribute("data-theme", theme);
      if (localStorage.getItem("sidebarCollapsed") === "1") document.documentElement.setAttribute("data-sidebar", "collapsed");
    } catch (e) { /* localStorage unavailable (private mode, some webviews) */ }
  })();
  </script>
  <link rel="stylesheet" href="static/app.css">
  <style>
    .layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 960px) {
      .layout { grid-template-columns: 360px minmax(0, 1fr); align-items: start; }
      .viewer { position: sticky; top: 16px; }
      .viewer-img { max-height: calc(100vh - 210px) !important; }
    }
    .viewer-img { width: 100%; max-height: 240px; object-fit: contain; background: #000; cursor: zoom-in; }
    .thumbs { display: flex; gap: 8px; padding: 10px; overflow-x: auto; border-top: 1px solid var(--line); }
    .thumbs button { flex: none; width: 52px; height: 68px; padding: 0; border: 2px solid transparent; border-radius: 8px; overflow: hidden; background: #000; }
    .thumbs button[aria-current="true"] { border-color: var(--accent); }
    .thumbs img { width: 100%; height: 100%; object-fit: cover; }
    .viewer-cap { display: flex; justify-content: space-between; padding: 10px 14px; font-size: .8rem; color: var(--muted); border-top: 1px solid var(--line); }

    /* lightbox */
    dialog.lightbox { max-width: 100vw; width: 100vw; height: 100vh; height: 100dvh; max-height: 100dvh; border-radius: 0; border: 0; background: #000; }
    .lb-bar { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 10px; color: #fff; }
    .lb-bar .icon-btn { color: #fff; }
    .lb-bar .icon-btn:hover { background: rgba(255,255,255,.14); }
    .lb-scroll { height: calc(100vh - 56px); height: calc(100dvh - 56px); overflow: auto; display: grid; }
    .lb-img { margin: auto; max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
    .lb-scroll.zoomed .lb-img { max-width: none; max-height: none; width: 220%; cursor: zoom-out; }

    /* progress */
    .steps-list { display: grid; gap: 12px; margin: 18px 0 6px; }
    .step { display: flex; align-items: center; gap: 12px; color: var(--faint); font-weight: 600; }
    .step .mark { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); flex: none; }
    .step .mark svg { width: 14px; height: 14px; }
    .step.done { color: var(--muted); } .step.done .mark { background: var(--accent); color: var(--accent-ink); }
    .step.now { color: var(--text); }

    /* recon */
    .recon { display: grid; gap: 6px; }
    .recon .line { display: flex; gap: 8px; align-items: flex-start; }
    .recon .line svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }

    /* items */
    .items-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .chip { border: 0; border-radius: 999px; padding: 4px 12px; font-size: .78rem; font-weight: 650; background: var(--warn-soft); color: var(--warn); }
    .chip[aria-pressed="true"] { background: var(--warn); color: #1a1200; }
    .item { display: grid; grid-template-columns: minmax(0, 1fr) 96px 34px; column-gap: 8px; align-items: center; padding: 8px 10px 8px 12px; border-top: 1px solid var(--line); border-left: 3px solid transparent; }
    .item.warn { border-left-color: var(--warn); background: var(--warn-soft); }
    .item.bad { border-left-color: var(--danger); background: var(--danger-soft); }
    .ghost { width: 100%; min-height: 38px; padding: 0 8px; border: 1px solid transparent; border-radius: 8px; background: transparent; outline: none; }
    .ghost:hover { border-color: var(--line); }
    .ghost:focus { border-color: var(--accent); background: var(--bg); }
    .ghost:disabled { opacity: 1; }
    .item .desc { font-weight: 600; }
    .item .total { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
    .item .was { grid-column: 1; font-size: .74rem; color: var(--faint); padding: 0 8px; }
    .item .common { grid-column: 1; display: flex; align-items: center; gap: 6px; padding: 0 8px; color: var(--faint); }
    .item .common svg { width: 14px; height: 14px; flex: none; }
    .item .common input { flex: 1; min-width: 0; width: 100%; min-height: 28px; border: 1px solid transparent; border-radius: 6px; background: transparent; outline: none; font-size: .82rem; color: var(--muted); padding: 0 6px; }
    .item .common input:hover { border-color: var(--line); }
    .item .common input:focus { border-color: var(--accent); background: var(--bg); color: var(--text); }
    .item .common input.named { color: var(--accent); font-weight: 600; }
    .item .common input::placeholder { color: var(--faint); }
    .item .meta { grid-column: 1; padding: 0 8px; font-size: .8rem; color: var(--muted); min-height: 0; }
    .item .meta:empty { display: none; }
    .item .expand { grid-column: 3; grid-row: 1; }
    .item .expand svg { transition: transform .15s; }
    .item .expand[aria-expanded="true"] svg { transform: rotate(180deg); }
    .item .flag { grid-column: 1 / -1; padding: 4px 8px 2px; font-size: .82rem; }
    .item.warn .flag { color: var(--warn); } .item.bad .flag { color: var(--danger); }
    .item .details { grid-column: 1 / -1; padding: 10px 4px 6px; display: grid; gap: 12px; }
    .item-add { padding: 10px 12px 12px; border-top: 1px solid var(--line); }

    .totals { display: grid; gap: 8px; }
    .totals .trow { display: grid; grid-template-columns: 1fr 140px; align-items: center; gap: 10px; }
    .totals .trow.grand > span { font-weight: 700; font-size: 1.02rem; }
    .totals .trow.grand .input { font-weight: 700; font-size: 1.05rem; }
    .linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: .82rem; padding: 2px 0; text-align: left; }
    .linkbtn:hover { text-decoration: underline; }

    details.more > summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: .88rem; padding: 4px 0; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: .88rem; }
    .kv dt { color: var(--muted); } .kv dd { text-align: right; word-break: break-word; }
    .center { text-align: center; padding: 40px 20px; }
    .center h2 { margin: 12px 0 6px; }
    .center .big { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto; background: var(--accent-soft); color: var(--accent); }
    .center .big svg { width: 32px; height: 32px; }
  </style>
</head>
<body>
  <div class="page" id="page">
    <div class="topbar stacked" id="topbar"></div>
    <div id="fatal" hidden></div>
    <div class="layout" id="layout" hidden>
      <aside class="viewer" id="viewer"></aside>
      <main class="stack" id="editor"></main>
    </div>
    <div class="stack" id="skeleton">
      <div class="skeleton" style="height:56px"></div><div class="skeleton" style="height:180px"></div><div class="skeleton" style="height:260px"></div>
    </div>
  </div>

  <div class="actionbar" id="actionbar" hidden>
    <div class="actionbar-inner">
      <div class="summary"><div class="total" id="sumTotal"></div><div class="meta" id="sumMeta"></div></div>
      <button class="btn" id="saveBtn" hidden>Save</button>
      <button class="btn btn-primary" id="approveBtn">Approve &amp; save</button>
    </div>
  </div>

  <datalist id="chains"></datalist>
  <script src="static/backnav.js"></script>
  <script src="static/app.js"></script>
  <script>
    const { h, icon, api, money, fmtDate, parseNumber, fixed2, trimNum, itemMathIssue, reconcile, isNum,
            toast, confirmDialog, formDialog, statusPill, parseExtraction } = RPI;
    const $ = (id) => document.getElementById(id);

    const HEADER_KEYS = ['store_name', 'store_address', 'store_number', 'purchase_date', 'purchase_time', 'receipt_number',
      'currency', 'subtotal', 'discount_total', 'tax_total', 'fee_total', 'grand_total', 'tags'];
    // Same canonical units the server normalizes to (app/services/units.py), so every item's
    // dropdown offers the same options instead of a different one tacked on per item.
    const WEIGHT_UNITS = ['LB', 'KG', 'OZ', 'G', 'GAL', 'QT', 'PT', 'L', 'ML', 'FLOZ'];
    const PRICE_UNITS = ['each', 'LB', 'KG', 'OZ', 'G', 'GAL', 'QT', 'PT', 'L', 'ML', 'FLOZ', 'CT'];
    const ITEM_KEYS = ['receipt_description', 'item_type', 'quantity', 'weight_value', 'weight_unit', 'unit_price',
      'unit_price_unit', 'line_subtotal', 'discount_amount', 'line_total', 'tax_amount', 'extraction_confidence',
      'suggested_common_item_id', 'suggested_common_item_name', 'original_description'];
    const UNREADABLE = '(unreadable line)';

    const draftId = new URLSearchParams(location.search).get('id');
    let draft = null, extraction = {}, header = {}, baseHeader = '', items = [], baseItems = '', taxes = [];
    let editable = false, dirty = false, busy = false, onlyFlagged = false, keySeq = 0;
    let pollTimer = null, stallCount = 0;
    let homeName = '', extrasLoaded = false, commonItems = [], onlyUnnamed = false, rereadNotice = null;

    const cur = () => header.currency || 'USD';
    const snapshotItems = () => JSON.stringify(items.map((i) => ITEM_KEYS.map((k) => i[k] ?? null)));
    const imgUrl = (img) => RPI.url(`api/v1/receipt-drafts/${draftId}/images/${img.id}`);

    // ------------------------------------------------------------------ load
    async function load() {
      clearTimeout(pollTimer);
      try {
        draft = await api('api/v1/receipt-drafts/' + encodeURIComponent(draftId));
      } catch (e) {
        $('skeleton').hidden = true;
        $('fatal').hidden = false;
        $('fatal').replaceChildren(h('div', { class: 'banner danger' }, icon('alert'),
          h('div', { class: 'banner-body' }, h('strong', {}, e.status === 404 ? 'Receipt not found. ' : 'Couldn’t load this receipt. '),
            h('span', { class: 'banner-text' }, e.message)),
          h('a', { class: 'btn btn-sm', href: 'index.html' }, 'All receipts')));
        renderTopbar();
        return;
      }
      applyDraft();
      rereadNotice = null;
      const captureNote = sessionStorage.getItem('capture:note:' + draftId);
      if (captureNote) { sessionStorage.removeItem('capture:note:' + draftId); toast(captureNote, 'error'); }
      if (draft.status !== 'PROCESSING' && sessionStorage.getItem('reread:' + draftId)) {
        sessionStorage.removeItem('reread:' + draftId);
        if (draft.status === 'NEEDS_REVIEW' && extraction.reextract_error) rereadNotice = extraction.reextract_error;
        else if (draft.status === 'NEEDS_REVIEW') toast(extraction.meta && extraction.meta.correction ? 'Read again with your note' : 'Read again', 'success');
      }
      $('skeleton').hidden = true; $('fatal').hidden = true; $('layout').hidden = false;
      render();
      loadExtras();
    }

    // Home name and known store names. Nice to have, so failures are ignored.
    async function loadExtras() {
      if (extrasLoaded) return;
      extrasLoaded = true;
      try {
        const [homes, chains, commons] = await Promise.all([
          api('api/v1/homes'), api('api/v1/stores/chains'),
          draft.home_id ? api(`api/v1/homes/${encodeURIComponent(draft.home_id)}/common-items?limit=1000`) : Promise.resolve([]),
        ]);
        commonItems = commons.filter((c) => c.name_confirmed).concat(commons.filter((c) => !c.name_confirmed));
        const home = homes.find((x) => x.id === draft.home_id);
        if (home) { homeName = home.name; renderTopbar(); }
        $('chains').replaceChildren(...chains.map((c) => h('option', { value: c })));
      } catch (_) { /* optional */ }
    }

    function applyDraft() {
      extraction = parseExtraction(draft);
      header = {}; for (const k of HEADER_KEYS) header[k] = extraction[k] ?? null;
      header.tags = Array.isArray(extraction.tags) ? extraction.tags : [];
      baseHeader = JSON.stringify(header);
      items = (draft.items || []).map((i) => ({ ...i, _k: ++keySeq, _touched: false }));
      baseItems = snapshotItems();
      taxes = draft.taxes || [];
      editable = draft.status === 'NEEDS_REVIEW';
      dirty = false;
    }

    function render() {
      renderTopbar();
      $('viewer').replaceChildren(renderViewer());
      const st = draft.status;
      if (st === 'PROCESSING') renderProcessing();
      else if (st === 'EXTRACTION_FAILED') renderFailed();
      else renderEditor();
      updateActionBar();
    }

    // ------------------------------------------------------------------ top bar
    function renderTopbar() {
      const bar = $('topbar');
      const title = draft ? (header.store_name || 'Review receipt') : 'Receipt';
      const sub = draft ? [header.purchase_date ? fmtDate(header.purchase_date) : null,
        items.length && draft.status !== 'PROCESSING' ? `${items.length} items` : null, homeName || null].filter(Boolean).join(' · ') : '';
      const kids = [
        h('a', { class: 'back', href: 'index.html', 'aria-label': 'All receipts' }, icon('back'), 'Receipts'),
        h('div', { class: 'grow' }, h('h1', {}, title), sub ? h('div', { class: 'sub' }, sub) : null),
      ];
      if (draft) {
        kids.push(statusPill(draft.status, draft.editing_saved));
        if (['NEEDS_REVIEW', 'EXTRACTION_FAILED', 'PROCESSING', 'APPROVED'].includes(draft.status)) kids.push(renderMenu());
      }
      bar.replaceChildren(...kids);
    }

    function renderMenu() {
      const saved = draft.status === 'APPROVED';
      const editingSaved = draft.status === 'NEEDS_REVIEW' && draft.editing_saved;
      const hasPhotos = (draft.images || []).length > 0;   // photos are deleted once a receipt is saved
      const item = (label, ico, fn, cls) => h('button', { type: 'button', class: cls || '', onclick: () => { d.open = false; fn(); } }, icon(ico), label);
      const d = h('details', { class: 'menu' },
        h('summary', { class: 'icon-btn', 'aria-label': 'More actions' }, icon('more')),
        h('div', { class: 'menu-list' },
          saved ? item('Edit receipt', 'edit', editSaved) : null,
          editingSaved ? item('Cancel editing', 'back', cancelEdit) : null,
          !saved && draft.status !== 'PROCESSING' && hasPhotos ? item('Read again with a note', 'refresh', reread) : null,
          editable && items.length ? item('Clear all lines', 'edit', clearLines) : null,
          saved || editingSaved ? item('Delete receipt', 'trash', deleteSaved, 'danger') : item('Discard receipt', 'trash', discard, 'danger')));
      return d;
    }
    document.addEventListener('click', (e) => { document.querySelectorAll('details.menu[open]').forEach((m) => { if (!m.contains(e.target)) m.open = false; }); });

    // ------------------------------------------------------------------ photo viewer + lightbox
    function renderViewer() {
      const imgs = draft.images || [];
      if (!imgs.length) return h('div', { class: 'card' }, h('div', { class: 'card-body muted' },
        draft.status === 'APPROVED' ? 'The photo isn’t kept after a receipt is saved. Only its details are stored.' : 'No photo attached'));
      let current = 0;
      const main = h('img', { class: 'viewer-img', alt: 'Receipt photo — tap to enlarge', src: imgUrl(imgs[0]), onclick: () => openLightbox(current, imgs) });
      const thumbs = imgs.length > 1 ? h('div', { class: 'thumbs' }, imgs.map((im, i) =>
        h('button', { type: 'button', 'aria-label': `Page ${i + 1}`, 'aria-current': String(i === 0), onclick: (e) => {
          current = i; main.src = imgUrl(im);
          thumbs.querySelectorAll('button').forEach((b, j) => b.setAttribute('aria-current', String(j === i)));
        } }, h('img', { src: imgUrl(im), alt: '' })))) : null;
      return h('div', { class: 'card' }, main, thumbs,
        h('div', { class: 'viewer-cap' }, h('span', {}, (imgs.length > 1 ? `${imgs.length} pages` : 'Original photo') + (editable ? ' · deleted when you save' : '')), h('span', {}, 'Tap to enlarge')));
    }

    function openLightbox(start, imgs) {
      let i = start, zoom = false;
      const img = h('img', { class: 'lb-img', alt: 'Receipt' });
      const scroller = h('div', { class: 'lb-scroll' }, img);
      const label = h('span', { class: 'grow' });
      const prev = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Previous page' }, icon('back'));
      const next = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Next page', style: 'transform:scaleX(-1)' }, icon('back'));
      const dlg = h('dialog', { class: 'lightbox' },
        h('div', { class: 'lb-bar' }, label, imgs.length > 1 ? [prev, next] : null,
          h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Close', onclick: () => dlg.close() }, icon('x'))),
        scroller);
      const show = () => { img.src = imgUrl(imgs[i]); label.textContent = imgs.length > 1 ? `Page ${i + 1} of ${imgs.length}` : 'Tap the photo to zoom'; scroller.classList.toggle('zoomed', zoom); };
      img.addEventListener('click', () => { zoom = !zoom; show(); });
      prev.addEventListener('click', () => { i = (i - 1 + imgs.length) % imgs.length; zoom = false; show(); });
      next.addEventListener('click', () => { i = (i + 1) % imgs.length; zoom = false; show(); });
      dlg.addEventListener('close', () => dlg.remove());
      document.body.append(dlg); show(); dlg.showModal();
    }

    // ------------------------------------------------------------------ processing / failed
    const STEPS = ['Preparing the photo', 'Reading the receipt', 'Checking the totals'];
    function stepFor(msg) {
      if (/check/i.test(msg || '')) return 2;
      if (/read|process|model|json/i.test(msg || '')) return 1;
      return 0;
    }
    function renderProcessing() {
      $('actionbar').hidden = true;
      const stepEls = STEPS.map((s) => h('div', { class: 'step' }, h('span', { class: 'mark' }), s));
      const elapsed = h('span', { class: 'muted small' });
      const note = h('p', { class: 'muted small', style: 'margin-top:10px' });
      const stalled = h('div', { hidden: true });
      $('editor').replaceChildren(h('div', { class: 'card' }, h('div', { class: 'card-body' },
        h('div', { class: 'row' }, h('div', { class: 'spinner lg' }), h('div', { class: 'grow' },
          h('h2', { style: 'font-size:1.1rem' }, 'Reading your receipt'), elapsed)),
        h('div', { class: 'steps-list' }, stepEls), note, stalled)));

      const paint = (s) => {
        const at = stepFor(s.last_event);
        stepEls.forEach((el, n) => {
          el.className = 'step' + (n < at ? ' done' : n === at ? ' now' : '');
          el.firstChild.replaceChildren(n < at ? icon('check') : '');
        });
        const secs = Math.round(s.elapsed_seconds || 0);
        elapsed.textContent = s.active ? `${secs}s elapsed` : '';
        note.textContent = secs > 45 ? 'Large models can take a minute or two on a home server. You can leave this page; it will keep going.' : '';
        if (!s.active) stallCount++; else stallCount = 0;
        stalled.hidden = stallCount < 3;
        if (!stalled.hidden && !stalled.firstChild) {
          stalled.append(h('div', { class: 'banner warn', style: 'margin-top:12px' }, icon('alert'),
            h('div', { class: 'banner-body' }, h('strong', {}, 'The reader isn’t running. '),
              h('span', { class: 'banner-text' }, 'The server may have restarted. Start it again.')),
            h('button', { class: 'btn btn-sm', onclick: () => startExtraction() }, 'Start')));
        }
      };
      paint({ last_event: 'Preparing', active: true, elapsed_seconds: 0 });
      stallCount = 0;
      const poll = async () => {
        try {
          const s = await api('api/v1/extraction/status/' + encodeURIComponent(draftId));
          if (s.status !== 'PROCESSING') return load();
          paint(s);
        } catch (_) { /* transient; keep polling */ }
        pollTimer = setTimeout(poll, 2000);
      };
      pollTimer = setTimeout(poll, 800);
    }

    async function requestExtraction(correction) {
      const body = { draft_id: draftId };
      const note = (correction || '').trim();
      if (note) body.correction = note;
      await api('api/v1/extraction/extract', { method: 'POST', body });
      sessionStorage.setItem('reread:' + draftId, '1');
    }
    async function startExtraction() {
      try { await requestExtraction(); await load(); }
      catch (e) { toast(e.message, 'error'); }
    }

    // The model couldn't read it: type it in by hand, using the photo.
    async function enterManually() {
      try { await api(`api/v1/receipt-drafts/${encodeURIComponent(draftId)}/manual`, { method: 'POST', body: {} }); await load(); }
      catch (e) { toast(e.message, 'error'); }
    }

    // Read the receipt again. The note is added to the instructions the model already gets.
    async function reread() {
      const meta = extraction.meta || {};
      const warning = editable
        ? (dirty ? 'You have unsaved edits. ' : '') + 'The items and totals below will be replaced by the new reading, including edits and common names you added.'
        : '';
      const ok = await formDialog({
        title: 'Read this receipt again',
        body: 'Tell the reader what it got wrong. Your note is added to the instructions it already follows. ' + warning,
        fields: [{ key: 'correction', type: 'textarea', label: 'Note for the reader', value: meta.correction || '', maxlength: 1000,
          placeholder: 'e.g. The store is King Soopers. Line 3 is 2 items at $1.99 each, not 1. Ignore the points summary at the bottom.',
          hint: 'Optional. Say where to look or what a line means. Up to 1000 characters.' }],
        submitLabel: 'Read again',
        onSubmit: async (v) => { await requestExtraction(v.correction); dirty = false; },
      });
      if (ok) await load();
    }

    function renderFailed() {
      $('actionbar').hidden = true;
      const raw = extraction.raw_response;
      $('editor').replaceChildren(...[
        h('div', { class: 'banner danger' }, icon('alert'),
          h('div', { class: 'banner-body' }, h('strong', {}, 'Couldn’t read this receipt. '),
            h('span', { class: 'banner-text' }, extraction.error || 'The model didn’t return usable data.'))),
        h('div', { class: 'card' }, h('div', { class: 'card-body row wrap' },
          h('button', { class: 'btn btn-primary', onclick: () => startExtraction() }, icon('refresh'), 'Try again'),
          h('button', { class: 'btn', onclick: reread }, 'Try again with a note'),
          h('button', { class: 'btn', onclick: enterManually }, icon('edit'), 'Enter it manually'),
          h('button', { class: 'btn btn-danger', onclick: discard }, 'Discard'),
          h('span', { class: 'muted small' }, 'A clearer photo can help. You can also try again, or type it in yourself.'))),
        raw ? h('details', { class: 'card' }, h('summary', { class: 'card-body', style: 'cursor:pointer;font-weight:600' }, 'What the model said'),
          h('div', { class: 'card-body', style: 'padding-top:0' }, h('pre', { class: 'code' }, raw))) : null,
      ].filter(Boolean));
    }

    // ------------------------------------------------------------------ editor
    function markDirty() {
      dirty = true;
      refreshDerived();
    }

    function flagFor(it) {
      const conf = it.extraction_confidence;
      if (it.receipt_description === UNREADABLE) return { level: 'bad', text: 'This line couldn’t be read. Check it against the photo.' };
      if (!it._touched && isNum(conf) && conf < 0.5) return { level: 'bad', text: 'Hard to read. Please check this line against the photo.' };
      const math = itemMathIssue(it);
      if (math) return { level: 'warn', text: math };
      if (!isNum(it.line_total)) return { level: 'warn', text: 'No price found for this line.' };
      if (!it._touched && isNum(conf) && conf < 0.8) return { level: 'warn', text: 'Low confidence. Worth a quick look.' };
      return null;
    }

    function metaText(it) {
      const parts = [];

      $('sumTotal').textContent = total != null ? money(total, cur()) : '—';
      $('sumMeta').textContent = `${items.length} item${items.length === 1 ? '' : 's'}${dirty ? ' · unsaved changes' : ''}`;
      $('saveBtn').hidden = !dirty;
      $('saveBtn').disabled = busy; $('approveBtn').disabled = busy;
    }

    // ------------------------------------------------------------------ actions
    function cleanItems() {
      return items.map((it) => {
        const hasAmount = ['line_total', 'line_subtotal', 'unit_price'].some((k) => isNum(it[k]));
        const desc = (it.receipt_description || '').trim();
        if (!desc && !hasAmount) return null;
        const out = {};
        for (const k of ITEM_KEYS) out[k] = it[k] ?? null;
        out.receipt_description = desc || 'Unnamed item';
        out.extraction_confidence = it._touched ? 1 : (isNum(it.extraction_confidence) ? it.extraction_confidence : null);
        return out;
      }).filter(Boolean);
    }

    async function save() {
      const patch = {}; const base = JSON.parse(baseHeader);
      for (const k of HEADER_KEYS) if (JSON.stringify(header[k] ?? null) !== JSON.stringify(base[k] ?? null)) patch[k] = header[k] ?? null;
      if (Object.keys(patch).length) draft = await api('api/v1/receipt-drafts/' + encodeURIComponent(draftId), { method: 'PATCH', body: patch });
      const cleaned = cleanItems();
      if (snapshotItems() !== baseItems || cleaned.length !== items.length) {
        draft = await api(`api/v1/receipt-drafts/${encodeURIComponent(draftId)}/items`, { method: 'PUT', body: { items: cleaned } });
      }
      const keepOnlyFlagged = onlyFlagged;
      applyDraft(); onlyFlagged = keepOnlyFlagged;
    }

    async function guarded(fn) {
      if (busy) return;
      busy = true; updateActionBar();
      try { await fn(); } catch (e) { toast(e.message, 'error'); }
      finally { busy = false; if (draft && editable) { renderEditor(); updateActionBar(); } }
    }

    $('saveBtn').addEventListener('click', () => guarded(async () => { await save(); toast('Changes saved', 'success'); }));

    $('approveBtn').addEventListener('click', async () => {
      if (!items.length) return toast('Add at least one item first', 'error');
      const missing = [];
      if (!(header.store_name || '').trim()) missing.push(['store name', 'f-store']);
      if (!header.purchase_date) missing.push(['date', 'f-date']);
      if (missing.length) {
        toast(`Add the ${missing.map((m) => m[0]).join(' and ')} first. They’re needed to record prices.`, 'error');
        const el = document.getElementById(missing[0][1]);
        if (el) { el.classList.add('invalid'); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.focus(); }
        return;
      }
      const issues = reconcile(header, items, taxes).checks.filter((c) => !c.ok).map((c) => c.text);
      const flagged = items.filter((i) => flagFor(i)).length;
      if (flagged) issues.push(`${flagged} line${flagged > 1 ? 's are' : ' is'} still flagged`);
      if (issues.length && !(await confirmDialog({ title: 'Save with open questions?', body: 'These still look off. Go back to fix them, or save anyway.',
        items: issues, confirmLabel: 'Save anyway', cancelLabel: 'Keep editing' }))) return;
      let approved = false;
      const wasEditing = !!draft.editing_saved;
      await guarded(async () => {
        await save();
        const url = `api/v1/receipt-drafts/${encodeURIComponent(draftId)}/approve`;
        try {
          draft = await api(url, { method: 'POST', body: {} });
        } catch (e) {
          // Looks like a receipt that is already saved: let the person decide
          const dups = e.status === 409 && e.data && e.data.duplicates;
          if (!dups || !dups.length) throw e;
          const lines = dups.map((x) => `${x.store} · ${fmtDate(x.date)}${x.total != null ? ' · ' + money(x.total, cur()) : ''} (same ${x.matches.join(' and ')})`);
          if (!(await confirmDialog({ title: 'You may have saved this already', body: 'A saved receipt matches this one. Save it anyway?', items: lines,
            confirmLabel: 'Save anyway', cancelLabel: 'Go back' }))) return;
          draft = await api(url, { method: 'POST', body: { allow_duplicate: true } });
        }
        approved = true;
      });
      if (approved) showSaved(wasEditing);
    });

    function showSaved(wasEditing) {
      dirty = false; editable = false;
      renderTopbar();
      $('actionbar').hidden = true;
      $('layout').hidden = true;
      const total = isNum(header.grand_total) ? header.grand_total : reconcile(header, items, taxes).itemsSum;
      $('page').append(h('div', { class: 'card center', style: 'max-width:480px;margin:40px auto' },
        h('div', { class: 'big' }, icon('check')), h('h2', {}, wasEditing ? 'Receipt updated' : 'Receipt saved'),
        h('p', { class: 'muted' }, [header.store_name, total != null ? money(total, cur()) : null, `${items.length} items`].filter(Boolean).join(' · ')),
        draft.approval ? h('p', { class: 'small muted', style: 'margin-top:8px' },
          `Recorded ${draft.approval.price_observations} price${draft.approval.price_observations === 1 ? '' : 's'} at ${draft.approval.store_name}`
          + (draft.approval.items_created ? ` · ${draft.approval.items_created} new item${draft.approval.items_created === 1 ? '' : 's'}` : '')) : null,
        h('div', { class: 'row', style: 'justify-content:center;margin-top:20px' },
          h('a', { class: 'btn btn-primary', href: 'capture.html' }, icon('camera'), 'Scan another'),
          h('a', { class: 'btn', href: 'index.html' }, 'All receipts'))));
    }

    // Reopen a saved receipt so any part of it can be corrected. It stays in the history until saved again.
    async function editSaved() {
      try {
        await api(`api/v1/receipt-drafts/${encodeURIComponent(draftId)}/reopen`, { method: 'POST', body: {} });
        await load(); toast('Editing. The saved version stays in your history until you save.', 'success');
      } catch (e) { toast(e.message, 'error'); }
    }
    async function cancelEdit() {
      if (!(await confirmDialog({ title: 'Cancel editing?', body: 'Your changes are dropped and the receipt goes back to how it was saved.', confirmLabel: 'Cancel editing', cancelLabel: 'Keep editing' }))) return;
      try { await api(`api/v1/receipt-drafts/${encodeURIComponent(draftId)}/discard-edit`, { method: 'POST', body: {} }); dirty = false; await load(); }
      catch (e) { toast(e.message, 'error'); }
    }
    async function deleteSaved() {
      if (!(await confirmDialog({ title: 'Delete this receipt?', body: 'It is removed from your history, and its prices from spending and price trends. This can’t be undone.', confirmLabel: 'Delete receipt', danger: true }))) return;
      try { await api(`api/v1/receipt-drafts/${encodeURIComponent(draftId)}/saved`, { method: 'DELETE' }); dirty = false; RPI.go('index.html'); }
      catch (e) { toast(e.message, 'error'); }
    }

    async function discard() {
      if (!(await confirmDialog({ title: 'Discard this receipt?', body: 'Nothing will be saved to your history.', confirmLabel: 'Discard', danger: true }))) return;
      try { await api(`api/v1/receipt-drafts/${encodeURIComponent(draftId)}/reject`, { method: 'POST', body: {} }); dirty = false; RPI.go('index.html'); }
      catch (e) { toast(e.message, 'error'); }
    }

    window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

    if (!draftId) {
      $('skeleton').hidden = true; $('fatal').hidden = false;
      $('fatal').replaceChildren(h('div', { class: 'banner danger' }, icon('alert'), h('div', { class: 'banner-body' }, 'No receipt specified.'), h('a', { class: 'btn btn-sm', href: 'index.html' }, 'All receipts')));
      renderTopbar();
    } else { renderTopbar(); load(); }
  </script>
</body>
</html>

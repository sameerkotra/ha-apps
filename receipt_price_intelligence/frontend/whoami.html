<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>How the app sees you</title>
  <script>
  (function () {
    var THEMES = ["midnight", "slate", "daylight"];
    try {
      var theme = localStorage.getItem("theme");
      if (theme && THEMES.indexOf(theme) !== -1) document.documentElement.setAttribute("data-theme", theme);
      if (localStorage.getItem("sidebarCollapsed") === "1") document.documentElement.setAttribute("data-sidebar", "collapsed");
    } catch (e) { /* localStorage unavailable (private mode, some webviews) */ }
  })();
  </script>
  <link rel="stylesheet" href="static/app.css">
</head>
<body>
  <div class="page narrow">
    <div class="topbar">
      <div class="grow"><h1>How the app sees you</h1><div class="sub">What Home Assistant sent, and whether it is on admin_users</div></div>
    </div>
    <div id="content" class="stack" aria-live="polite"></div>
  </div>

  <script src="static/backnav.js"></script>
  <script src="static/app.js"></script>
  <script>
    const { h, api } = RPI;
    const c = document.getElementById('content');

    async function load() {
      let w;
      try { w = await api('api/v1/whoami'); } catch (e) { return c.replaceChildren(h('p', { class: 'form-error' }, e.message)); }
      const row = (k, v) => h('div', { class: 'kv-row' }, h('span', { class: 'k' }, k), h('span', { class: 'v' }, v));
      const name = w.nameSent ? w.username : null;
      let hint;
      if (w.isAdmin) hint = h('p', { class: 'muted' }, 'You are an administrator.');
      else if (w.adminEntries === 0) {
        hint = h('p', { class: 'muted' }, 'The admin_users list is empty in the running app. If you have filled it in, the app hasn’t picked it up yet: ',
          'changes to the app’s options only take effect after it is restarted (Settings → Apps → this app → Restart).');
      } else {
        hint = h('p', { class: 'muted' }, `Neither your user name nor your user id above matches any of the ${w.adminEntries} name${w.adminEntries === 1 ? '' : 's'} in the admin_users list. Add `,
          h('strong', {}, name || w.userId), ' (or ', h('strong', {}, w.userId), ') exactly as shown, save, and restart the app; the list is only read when the app starts. Upper and lower case do not matter.');
      }
      c.replaceChildren(
        h('div', { class: 'card' }, h('div', { class: 'card-body' }, h('div', { class: 'kv' },
          row('User name (sent by Home Assistant)', name || 'not sent'),
          row('User id (sent by Home Assistant)', w.userId),
          row('Display name', w.displayName || '—'),
          row('Administrator in this app', w.isAdmin ? 'Yes' : 'No'),
          row('Names in the app’s admin_users list', String(w.adminEntries))))),
        hint);
    }
    load();
  </script>
</body>
</html>

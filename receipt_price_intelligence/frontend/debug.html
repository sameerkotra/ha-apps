<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Web debug</title>
  <script>
  (function () {
    var THEMES = ["midnight", "slate", "daylight"];
    try {
      var theme = localStorage.getItem("theme");
      if (theme && THEMES.indexOf(theme) !== -1) document.documentElement.setAttribute("data-theme", theme);
      if (localStorage.getItem("sidebarCollapsed") === "1") document.documentElement.setAttribute("data-sidebar", "collapsed");
    } catch (e) { /* localStorage unavailable (private mode, some webviews) */ }
  })();
  </script>
  <link rel="stylesheet" href="static/app.css">
  <style>
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tabs button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
    .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: .88rem; margin: 0; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; overflow-wrap: anywhere; }
    .req { border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; overflow: hidden; }
    .req > summary { list-style: none; cursor: pointer; padding: 8px 10px; display: grid; gap: 2px; }
    .req > summary::-webkit-details-marker { display: none; }
    .req .line1 { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .85rem; }
    .req .url { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .78rem; color: var(--muted); overflow-wrap: anywhere; }
    .req .body { padding: 0 10px 10px; display: grid; gap: 8px; }
    .blk { display: grid; gap: 4px; }
    .blk .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .8rem; font-weight: 650; color: var(--muted); }
    .blk pre { margin: 0; max-height: 360px; overflow: auto; background: var(--surface-2); border-radius: 8px; padding: 8px;
               font-size: .75rem; line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere; }
    .svc { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 1px 7px; border-radius: 9px;
           background: var(--surface-3); }
    .svc.model { background: var(--info-soft); color: var(--info); }
    .svc.page { background: var(--warn-soft); color: var(--warn); }
    .svc.tavily, .svc.parallel, .svc.searxng, .svc.custom { background: var(--accent-soft); color: var(--accent); }
    .svc.cache { background: var(--surface-3); color: var(--muted); }
    .st-ok { color: var(--accent); font-weight: 700; }
    .st-bad { color: var(--danger); font-weight: 700; }
    .form-grid { display: grid; gap: 10px; }
    @media (min-width: 640px) { .form-grid.two { grid-template-columns: 1fr 1fr; } }
    .step { border-left: 3px solid var(--line); padding-left: 10px; }
    .step.good { border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="grow"><h1>Admin</h1><div class="sub">Web debug</div></div>
    </div>
    <div id="adminTabs"></div>
    <div id="content" class="stack" aria-live="polite"></div>
  </div>

  <script src="static/backnav.js"></script>
  <script src="static/app.js"></script>
  <script>
    const { h, icon, api, toast } = RPI;
    const $ = (id) => document.getElementById(id);
    $('adminTabs').replaceWith(RPI.adminTabs('debug'));

    let ctx = null, setup = null, opts = null, tab = 'try', tool = 'search', result = null, busy = false;
    let logRows = [], logFilter = '', autoTimer = null;
    let preset = null, presetBusy = null, presetLimit = '5';
    const form = { query: 'Kroger store hours', site: '', limit: '5', url: '', location: '', item: '', chain: '', dealChain: '', useCache: true };

    // ---------------------------------------------------------------- helpers
    const pretty = (v) => {
      if (v == null) return '';
      if (typeof v !== 'string') return JSON.stringify(v, null, 2);
      const t = v.trim();
      if (t.startsWith('{') || t.startsWith('[')) { try { return JSON.stringify(JSON.parse(t), null, 2); } catch (_) { /* not JSON */ } }
      return v;
    };
    const copyBtn = (text) => h('button', { class: 'btn btn-sm btn-ghost', type: 'button', onclick: async () => {
      try { await navigator.clipboard.writeText(text); toast('Copied', 'success'); } catch (_) { toast('Could not copy', 'error'); }
    } }, 'Copy');
    const block = (title, value) => {
      const text = pretty(value);
      if (!text) return null;
      return h('div', { class: 'blk' }, h('div', { class: 'hd' }, title, copyBtn(text)), h('pre', {}, text));
    };
    const when = (t) => new Date(t * 1000).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', second: '2-digit' });
    const SERVICE_NAMES = { tavily: 'Tavily', parallel: 'Parallel', searxng: 'SearXNG', custom: 'Search server', page: 'Page', model: 'Model', cache: 'Saved' };

    function requestView(e, open) {
      const ok = e.status && e.status < 400 && !e.error;
      return h('details', { class: 'req', open: open ? true : null },
        h('summary', {},
          h('div', { class: 'line1' },
            h('span', { class: 'svc ' + e.service }, SERVICE_NAMES[e.service] || e.service),
            h('strong', {}, e.action), h('span', {}, e.method),
            h('span', { class: ok ? 'st-ok' : 'st-bad' }, e.status ? String(e.status) : 'failed'),
            e.ms != null ? h('span', { class: 'muted small' }, `${e.ms} ms`) : null,
            e.received_chars != null ? h('span', { class: 'muted small' }, `${e.received_chars.toLocaleString()} chars`) : null,
            h('span', { class: 'muted small' }, when(e.time)),
            e.step ? h('span', { class: 'pill' }, e.step) : null),
          h('div', { class: 'url' }, e.url),
          e.error ? h('div', { class: 'small', style: 'color:var(--danger)' }, e.error) : null),
        h('div', { class: 'body' },
          e.note ? h('div', { class: 'small muted' }, e.note) : null,
          block('Sent', e.sent),
          e.content_type ? h('div', { class: 'small muted' }, 'Content-Type: ' + e.content_type) : null,
          block('Received' + (e.received_chars > 20000 ? ' (first 20,000 characters kept)' : ''), e.received)));
    }
    const traceView = (trace) => h('div', { class: 'stack', style: 'gap:0' },
      h('div', { class: 'sect', style: 'margin:6px 0 0' }, `Requests made (${trace.length})`),
      ...(trace.length ? trace.map((e) => requestView(e, false)) : [h('p', { class: 'note' }, 'No request was made.')]));

    // ---------------------------------------------------------------- setup card
    function setupCard() {
      if (!setup) return null;
      const s = setup;
      const rows = [
        ['Provider', s.provider + (s.configured ? '' : ' (not set up)')], ['Server', s.server || '—'],
        !s.hosted ? ['Address', s.search_url || '—'] : null,
        s.hosted ? ['API key', s.api_key_set ? 'set' : 'missing'] : null,
        s.provider === 'custom' ? ['Fields', `query: "${s.query_field}", url: "${s.url_field}"`] : null,
        s.provider === 'custom' && s.token_set ? ['Token', 'set'] : null,
        ['Pages opened by', s.pages_opened_by], ['Timeout', `${s.timeout_seconds} s`], ['Requests at once', String(s.concurrency)],
        !s.hosted ? ['Between searches', `${s.min_interval_seconds} s`] : null,
        ['Saved results', s.cache && s.cache.available ? (s.cache.days ? `${s.cache.searches} searches, ${s.cache.pages} pages (searches kept ${s.cache.days} days, pages 1 day)` : 'off') : 'not available'],
        ['Model', `${s.model} (${s.model_format})`],
      ].filter(Boolean);
      return h('div', { class: 'card' }, h('div', { class: 'card-body stack' },
        s.paused ? h('div', { class: 'banner warn' }, icon('alert'), h('div', { class: 'banner-body' },
          h('strong', {}, `Web searches are paused for ${s.paused.minutes_left} more minute(s). `), s.paused.reason + '. ',
          'Search engines limit automated searches from one address; waiting lets the blocks clear.',
          h('div', { style: 'margin-top:6px' }, h('button', { class: 'btn btn-sm', type: 'button', onclick: async () => {
            await api('api/v1/webdebug/resume', { method: 'POST' }); setup = await api('api/v1/webdebug/setup'); render();
          } }, 'Search again now')))) : null,
        h('dl', { class: 'kv' }, ...rows.flatMap(([k, v]) => [h('dt', {}, k), h('dd', {}, v)])),
        s.cache && (s.cache.searches || s.cache.pages) ? h('div', {}, h('button', { class: 'btn btn-sm btn-ghost', type: 'button', onclick: async () => {
          await api('api/v1/webdebug/cache', { method: 'DELETE' }); toast('Saved results cleared', 'success'); setup = await api('api/v1/webdebug/setup'); render();
        } }, 'Clear saved results')) : null));
    }

    // ---------------------------------------------------------------- try it
    const input = (key, label, placeholder, hint) => {
      const el = h('input', { class: 'input', value: form[key], placeholder: placeholder || '', oninput: (e) => { form[key] = e.target.value; } });
      return h('label', { class: 'field' }, h('span', { class: 'label' }, label), el, hint ? h('span', { class: 'field-hint', style: 'color:var(--muted)' }, hint) : null);
    };
    const select = (key, label, options) => {
      if (!form[key] && options.length) form[key] = options[0].value;
      const el = h('select', { class: 'select', onchange: (e) => { form[key] = e.target.value; } },
        ...options.map((o) => h('option', { value: o.value, selected: o.value === form[key] ? true : null }, o.label)));
      return h('label', { class: 'field' }, h('span', { class: 'label' }, label), el);
    };

    function toolForm() {
      const locs = (opts?.locations || []).map((l) => ({ value: l.id, label: l.label + (l.page_url ? ' · has store page' : '') }));
      const chains = (opts?.chains || []).map((c) => ({ value: c.id, label: c.name + (c.search_url ? ' · search page' : c.website ? ' · website' : '') }));
      const items = (opts?.items || []).map((i) => ({ value: i.id, label: i.name }));
      const fields = {
        search: [input('query', 'Search words'), h('div', { class: 'form-grid two' },
          input('site', 'Only this website (optional)', 'kroger.com', setup?.hosted ? `Sent as ${setup.provider_name}'s domain filter` : 'Added to the query as site:'),
          select('limit', 'Results', ['3', '5', '10'].map((v) => ({ value: v, label: v }))))],
        page: [input('url', 'Page address', 'https://www.example.com/stores/123',
          setup?.provider === 'custom' ? 'Opened through your search server\'s /fetch' : 'Opened by the app itself, as lookups do')],
        hours: locs.length ? [select('location', 'Location', locs)] : [h('p', { class: 'note' }, 'No store locations yet.')],
        price: items.length && chains.length ? [h('div', { class: 'form-grid two' }, select('item', 'Item', items), select('chain', 'Store', chains))]
          : [h('p', { class: 'note' }, 'Needs an item with prices and a store.')],
        deals: chains.length ? [select('dealChain', 'Store', chains)] : [h('p', { class: 'note' }, 'No stores yet.')],
      }[tool];
      const labels = { search: 'Search', page: 'Open page', hours: 'Find hours', price: 'Check price', deals: 'Look for deals' };
      return h('div', { class: 'card' }, h('div', { class: 'card-body stack' },
        h('div', { class: 'tabs' }, ...[['search', 'Search'], ['page', 'Open a page'], ['hours', 'Hours lookup'], ['price', 'Price check'], ['deals', 'Deals lookup']]
          .map(([k, label]) => h('button', { class: 'btn btn-sm', type: 'button', 'aria-pressed': String(tool === k), onclick: () => { tool = k; result = null; render(); } }, label))),
        h('div', { class: 'form-grid' }, ...fields),
        tool === 'search' || tool === 'page' ? h('label', { class: 'small', style: 'display:flex;gap:6px;align-items:center' },
          h('input', { type: 'checkbox', checked: form.useCache ? true : null, onchange: (e) => { form.useCache = e.target.checked; } }),
          'Use saved results (untick to send it again)') : null,
        h('div', { class: 'row', style: 'gap:8px;align-items:center' },
          h('button', { class: 'btn btn-primary', type: 'button', disabled: busy, onclick: runTool }, busy ? 'Running…' : labels[tool]),
          h('span', { class: 'note' }, tool === 'search' || tool === 'page' ? 'Uses one search or page request.' : 'Runs the full lookup; nothing is saved.'))));
    }

    async function runTool() {
      busy = true; result = null; render();
      const home = ctx.homeId;
      const calls = {
        search: () => api('api/v1/webdebug/search', { method: 'POST', body: { query: form.query, site: form.site || null, limit: Number(form.limit), use_cache: form.useCache } }),
        page: () => api('api/v1/webdebug/fetch', { method: 'POST', body: { url: form.url, use_cache: form.useCache } }),
        hours: () => api('api/v1/webdebug/hours', { method: 'POST', body: { home_id: home, location_id: form.location } }),
        price: () => api('api/v1/webdebug/price', { method: 'POST', body: { home_id: home, item_id: form.item, chain_id: form.chain } }),
        deals: () => api('api/v1/webdebug/deals', { method: 'POST', body: { home_id: home, chain_id: form.dealChain } }),
      };
      try { result = { tool, data: await calls[tool]() }; } catch (e) { result = { tool, data: { error: e.message, trace: [] } }; }
      busy = false;
      setup = await api('api/v1/webdebug/setup').catch(() => setup);
      render();
    }

    const listing = (x) => `${x.product} · ${x.price}${x.unit && x.unit !== 'each' ? ' / ' + x.unit : ''}${x.on_sale ? ' · on sale' : ''}${x.method ? ' · ' + x.method : ''}`;
    function resultView() {
      if (!result) return null;
      const d = result.data;
      const parts = [];
      if (d.error) parts.push(h('div', { class: 'banner danger' }, icon('alert'), h('div', { class: 'banner-body' }, d.error)));
      if (result.tool === 'search' && !d.error) {
        parts.push(h('dl', { class: 'kv' }, h('dt', {}, 'Query sent'), h('dd', {}, d.query_sent), h('dt', {}, 'Time'), h('dd', {}, `${d.ms} ms`)));
        parts.push(h('div', { class: 'sect', style: 'margin:6px 0 0' }, `Hits read from the answer (${d.hits.length})`));
        parts.push(...(d.hits.length ? d.hits.map((x, i) => h('div', { class: 'step' },
          h('div', { style: 'font-weight:600' }, `${i + 1}. ${x.title || '(no title)'}`),
          h('div', { class: 'url' }, x.url || '(no address: only the snippet can be used)'), x.snippet ? h('div', { class: 'small muted' }, x.snippet) : null))
          : [h('p', { class: 'note' }, 'No hits could be read. Check the Received part of the request below.')]));
      }
      if (result.tool === 'page' && !d.error) {
        parts.push(h('dl', { class: 'kv' }, h('dt', {}, 'Page size'), h('dd', {}, `${d.raw_chars.toLocaleString()} characters (${d.text_chars.toLocaleString()} of text)`),
          h('dt', {}, 'Times of day in it'), h('dd', {}, d.has_clock_times ? 'yes' : 'no'),
          h('dt', {}, 'Hours from structured data'), h('dd', {}, d.structured_hours ? JSON.stringify(d.structured_hours) : 'none'),
          h('dt', {}, 'Prices from the page'), h('dd', {}, `${d.structured_prices.length}`)));
        if (d.structured_prices.length) parts.push(block('Prices read from the page (no model)', d.structured_prices.map(listing).join('\n')));
        parts.push(block('What the model would be given for hours', d.hours_excerpt));
        parts.push(block('Page text (start)', d.text_preview));
      }
      if (result.tool === 'hours' && d.location) {
        parts.push(h('dl', { class: 'kv' }, h('dt', {}, 'Location'), h('dd', {}, `${d.location.label} · ${d.location.address || 'no address'}`),
          h('dt', {}, 'Store page'), h('dd', {}, d.location.page_url || 'none'), h('dt', {}, 'Store website'), h('dd', {}, d.location.website || 'none'),
          h('dt', {}, 'Result'), h('dd', {}, d.result ? `${JSON.stringify(d.result.hours)} (confidence ${d.result.confidence}${d.result.note ? ', ' + d.result.note : ''})` : 'no hours found'),
          d.result?.source_url ? h('dt', {}, 'From') : null, d.result?.source_url ? h('dd', {}, d.result.source_url) : null));
        if (d.from_openstreetmap) parts.push(h('p', { class: 'note' }, 'Taken from OpenStreetMap (Stores near home): no web request was needed.'));
      }
      if (result.tool === 'price' && d.item) {
        parts.push(h('dl', { class: 'kv' }, h('dt', {}, 'Item'), h('dd', {}, `${d.item.name}${d.item.unit ? ' (compared per ' + d.item.unit + ')' : ''}`),
          h('dt', {}, 'Store'), h('dd', {}, d.chain.name), h('dt', {}, 'Result'), h('dd', {}, d.picked ? `${listing(d.picked)} → ${d.picked.normalized}` : 'no price found')));
        parts.push(...d.pages.map((p, i) => h('div', { class: 'step' + (p.picked ? ' good' : '') },
          h('div', { style: 'font-weight:600' }, `Page ${i + 1}: ${p.title || ''}`), h('div', { class: 'url' }, p.url || '(search snippet only)'),
          h('div', { class: 'small' }, `${p.listing_count} listing(s) read from the page${p.model_used ? `; model asked, it listed ${(p.model_listings || []).length}` : ''}`),
          p.listings_on_page.length ? block('Listings from the page', p.listings_on_page.map(listing).join('\n')) : null,
          p.model_listings && p.model_listings.length ? block('Listings from the model', p.model_listings.map(listing).join('\n')) : null,
          h('div', { class: 'small' }, p.picked ? `Picked: ${listing(p.picked)} (match ${p.picked.score})` : 'Nothing on this page clearly matched the item'))));
      }
      if (result.tool === 'deals' && d.chain) {
        parts.push(...d.pages.map((p, i) => h('div', { class: 'step' + (p.matched.length ? ' good' : '') },
          h('div', { style: 'font-weight:600' }, `Page ${i + 1}: ${p.title || ''}`), h('div', { class: 'url' }, p.url || '(search snippet only)'),
          h('div', { class: 'small' }, `${p.on_sale_on_page.length} sale listing(s) read from the page${p.model_used ? `; model asked, it listed ${(p.model_deals || []).length}` : ''}`),
          p.on_sale_on_page.length ? block('Sale listings from the page', p.on_sale_on_page.map(listing).join('\n')) : null,
          p.model_deals && p.model_deals.length ? block('Deals from the model', p.model_deals.map(listing).join('\n')) : null,
          h('div', { class: 'small' }, p.matched.length ? 'Matched your items: ' + p.matched.map((m) => `${m.item} (${m.product} ${m.price})`).join('; ') : 'None matched your items'))));
        if (!d.pages.length && !d.error) parts.push(h('p', { class: 'note' }, 'No page to read was found.'));
      }
      if (d.trace) parts.push(traceView(d.trace));
      return h('div', { class: 'card' }, h('div', { class: 'card-body stack' }, ...parts));
    }

    // ---------------------------------------------------------------- presets
    const PRESETS = [
      ['queries', 'Show search queries', 'What every lookup would open and search for. Nothing is sent.'],
      ['hours', 'Find hours only', 'The hours lookup for each store location.'],
      ['prices', 'Check prices', 'The price check for your most bought items at the stores you buy them at.'],
      ['deals', 'Look for deals', 'The deals lookup at each store.'],
    ];
    function presetCard() {
      return h('div', { class: 'card' }, h('div', { class: 'card-body stack' },
        h('div', { class: 'row wrap', style: 'gap:8px;align-items:center;justify-content:space-between' },
          h('strong', {}, 'Presets'),
          h('label', { class: 'small', style: 'display:flex;gap:6px;align-items:center' }, 'How many',
            h('select', { class: 'select', style: 'width:auto', onchange: (e) => { presetLimit = e.target.value; } },
              ...['3', '5', '10', '25'].map((v) => h('option', { value: v, selected: v === presetLimit ? true : null }, v))))),
        h('div', { class: 'tabs' }, ...PRESETS.map(([k, label, hint]) =>
          h('button', { class: 'btn btn-sm' + (k === 'queries' ? '' : ' btn-primary'), type: 'button', title: hint, disabled: !!presetBusy, onclick: () => runPreset(k) }, label))),
        h('p', { class: 'note', style: 'margin:0' }, presetBusy || 'Runs one kind of lookup for all your stores or items, exactly as the real lookups do, with nothing saved. Runs one at a time, so it can take a while.')));
    }
    async function runPreset(kind) {
      preset = null; presetBusy = 'Starting…'; render();
      try {
        const r = await api('api/v1/webdebug/preset', { method: 'POST', body: { home_id: ctx.homeId, preset: kind, limit: Number(presetLimit) } });
        if (r.queries) preset = { kind, queries: r.queries };
        else {
          const done = await RPI.followJob(r.job.id, (j) => { presetBusy = `${PRESETS.find((p) => p[0] === kind)[1]}: ${j.done} of ${j.total} · ${j.message}`; render(); });
          const res = await api('api/v1/webdebug/preset/' + encodeURIComponent(r.job.id));
          preset = { kind, results: res.results, error: done.error, found: done.results, total: done.total };
        }
      } catch (e) { toast(e.message, 'error'); }
      presetBusy = null;
      setup = await api('api/v1/webdebug/setup').catch(() => setup);
      render();
    }
    const qline = (label, value, extra) => (value ? h('div', { class: 'small' }, h('span', { class: 'muted' }, label + ': '), h('span', { class: 'url' }, value), extra ? h('span', { class: 'muted' }, ' ' + extra) : null) : null);
    const trySearch = (query, site) => h('button', { class: 'btn btn-sm btn-ghost', type: 'button', onclick: () => {
      tool = 'search'; form.query = query; form.site = site || ''; result = null; render(); (document.querySelector('.main-col') || document.scrollingElement).scrollTo(0, 1e9); window.scrollTo(0, document.body.scrollHeight);
    } }, 'Try this search');
    function presetView() {
      if (!preset) return null;
      const title = PRESETS.find((p) => p[0] === preset.kind)[1];
      if (preset.queries) {
        const q = preset.queries;
        const via = (site) => (site ? (['tavily', 'parallel'].includes(q.provider) ? `on ${site} (domain filter)` : `+ site:${site}`) : '');
        return h('div', { class: 'card' }, h('div', { class: 'card-body stack' }, h('strong', {}, title),
          q.names && q.names.length ? h('div', { class: 'sect', style: 'margin:0' }, `Item names as searched (${q.names.length} changed)`) : null,
          ...(q.names || []).map((x) => h('div', { class: 'small' }, h('span', { class: 'muted' }, x.item + ' → '), h('strong', {}, x.search),
            x.match !== x.search ? h('span', { class: 'muted' }, ` (listings matched against “${x.match}”)`) : null)),
          q.skipped_items && q.skipped_items.length ? h('div', { class: 'small' }, h('strong', {}, 'Not looked up: '),
            q.skipped_items.map((x) => `${x.item} (${x.reason})`).join(', ')) : null,
          q.skipped_stores && q.skipped_stores.length ? h('div', { class: 'small' }, h('strong', {}, 'Stores not searched for items: '),
            q.skipped_stores.join(', '), h('span', { class: 'muted' }, ' (restaurants, or only fuel, fees or dishes bought there)')) : null,
          h('div', { class: 'sect', style: 'margin:0' }, `Hours (${q.hours.length} locations)`),
          ...q.hours.map((x) => h('div', { class: 'step' }, h('div', { style: 'font-weight:600' }, x.label),
            qline('1. Store page', x.store_page), x.site ? h('div', { class: 'row wrap', style: 'gap:6px;align-items:center' }, qline('2. Search', x.query, via(x.site)), trySearch(x.query, x.site)) : null,
            h('div', { class: 'row wrap', style: 'gap:6px;align-items:center' }, qline(`${x.site ? 3 : x.store_page ? 2 : 1}. Search`, x.query, 'on the whole web'), trySearch(x.query, '')))),
          q.area && q.area.length ? h('div', { class: 'sect', style: 'margin:0' }, `Area searches first (${q.area.length}): one per item, results filed under your stores`) : null,
          ...(q.area || []).map((x) => h('div', { class: 'row wrap', style: 'gap:6px;align-items:center' },
            qline(x.item, x.query, `→ ${x.stores.join(', ')}`), trySearch(x.query, ''))),
          h('div', { class: 'sect', style: 'margin:0' }, `Prices (${q.prices.length} item-at-store checks, for stores the area search did not price)`),
          ...q.prices.map((x) => h('div', { class: 'step' }, h('div', { style: 'font-weight:600' }, `${x.item} at ${x.store}`),
            qline('1. Store search page', x.store_search_url),
            x.site ? h('div', { class: 'row wrap', style: 'gap:6px;align-items:center' }, qline('2. Search', x.site_query, via(x.site)), trySearch(x.site_query, x.site)) : null,
            h('div', { class: 'row wrap', style: 'gap:6px;align-items:center' }, qline('Then search', x.web_query, 'on the whole web'), trySearch(x.web_query, '')))),
          h('div', { class: 'sect', style: 'margin:0' }, `Deals (${q.deals.length} stores)`),
          ...q.deals.map((x) => h('div', { class: 'step' }, h('div', { style: 'font-weight:600' }, x.store),
            qline('1. Weekly ad page', x.weekly_ad_page),
            ...x.queries.map((s) => h('div', { class: 'row wrap', style: 'gap:6px;align-items:center' }, qline('Search', s.query, s.site ? via(s.site) : 'on the whole web'), trySearch(s.query, s.site)))))));
      }
      return h('div', { class: 'card' }, h('div', { class: 'card-body stack' },
        h('div', {}, h('strong', {}, title), h('span', { class: 'note', style: 'margin-left:8px' }, `${preset.found} of ${preset.total} found · nothing saved`)),
        preset.error ? h('div', { class: 'banner danger' }, icon('alert'), h('div', { class: 'banner-body' }, preset.error)) : null,
        ...preset.results.map((r) => h('details', { class: 'req' },
          h('summary', {}, h('div', { class: 'line1' }, h('span', { class: r.ok ? 'st-ok' : 'st-bad' }, r.ok ? 'found' : 'none'), h('strong', {}, r.label),
            h('span', { class: 'muted small' }, `${r.requests} request${r.requests === 1 ? '' : 's'}`)),
            h('div', { class: 'small' }, r.summary), r.error ? h('div', { class: 'small', style: 'color:var(--danger)' }, r.error) : null),
          h('div', { class: 'body' }, traceView(r.detail.trace || []))))));
    }

    // ---------------------------------------------------------------- recent requests
    async function loadLog() {
      try { logRows = await api('api/v1/webdebug/log?limit=150' + (logFilter ? '&service=' + logFilter : '')); } catch (e) { toast(e.message, 'error'); }
      if (tab === 'log') render();
    }
    function logView() {
      return h('div', { class: 'card' }, h('div', { class: 'card-body stack' },
        h('div', { class: 'row wrap', style: 'gap:8px;align-items:center' },
          h('select', { class: 'select', style: 'width:auto', onchange: (e) => { logFilter = e.target.value; loadLog(); } },
            ...[['', 'All services'], ['tavily', 'Tavily'], ['parallel', 'Parallel'], ['searxng', 'SearXNG'], ['custom', 'Search server'], ['page', 'Pages'], ['model', 'Model'], ['cache', 'Saved results']]
              .map(([v, l]) => h('option', { value: v, selected: v === logFilter ? true : null }, l))),
          h('button', { class: 'btn btn-sm', type: 'button', onclick: loadLog }, 'Refresh'),
          h('label', { class: 'small', style: 'display:flex;gap:6px;align-items:center' },
            h('input', { type: 'checkbox', checked: autoTimer ? true : null, onchange: (e) => {
              if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
              if (e.target.checked) autoTimer = setInterval(loadLog, 3000);
            } }), 'Update every 3 s'),
          h('button', { class: 'btn btn-sm btn-ghost', type: 'button', onclick: async () => { await api('api/v1/webdebug/log', { method: 'DELETE' }); loadLog(); } }, 'Clear')),
        h('p', { class: 'note', style: 'margin:0' }, 'Every request made by lookups (hours, prices, deals, websites, Test connection), newest first. Kept in memory: the last 150, cleared when the app restarts. Keys and tokens are never shown.'),
        ...(logRows.length ? logRows.map((e) => requestView(e, false)) : [h('p', { class: 'note' }, 'No requests yet. Run a lookup, or use Try it.')])));
    }

    // ---------------------------------------------------------------- page
    function render() {
      const c = $('content');
      if (!ctx) return;
      if (!ctx.me.is_admin) { c.replaceChildren(h('div', { class: 'banner warn' }, icon('alert'), h('div', { class: 'banner-body' }, 'Only administrators can use this page.'))); return; }
      c.replaceChildren(
        setupCard(),
        h('div', { class: 'tabs' }, ...[['try', 'Try it'], ['log', 'Recent requests']].map(([k, label]) =>
          h('button', { class: 'btn', type: 'button', 'aria-pressed': String(tab === k), onclick: () => { tab = k; render(); if (k === 'log') loadLog(); } }, label))),
        ...(tab === 'try' ? [presetCard(), presetView(), toolForm(), resultView()] : [logView()]));
    }

    async function init() {
      try {
        ctx = await RPI.homeContext();
        if (ctx.me.is_admin) {
          [setup, opts] = await Promise.all([api('api/v1/webdebug/setup'), api('api/v1/webdebug/options?home_id=' + encodeURIComponent(ctx.homeId)).catch(() => null)]);
          const site = (opts?.chains || []).find((x) => x.website);
          if (site && !form.site) form.query = `${site.name} store hours`;
        }
        render();
      } catch (e) {
        $('content').replaceChildren(h('div', { class: 'banner danger' }, icon('alert'), h('div', { class: 'banner-body' }, e.message)));
      }
    }
    init();
  </script>
</body>
</html>

configuration:
  admin_users:
    name: Admins
    description: >-
      Home Assistant user names (login names) or user ids of the app's admins
      — display names are not accepted. Admins see every phone (Admin mode),
      choose the alerts and set up the app under Admin. Empty by default: until
      you add someone, every page shows "No admin yet". Not sure what to enter?
      Open the app and select your name: "How the app sees you" shows the exact
      value. Restart the app (Information tab → Restart) after changing this
      list.

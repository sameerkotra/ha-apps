name: "Splitpot"
version: "2.4.0"
slug: splitpot
description: >-
  Split shared household expenses and see who owes whom. Everyone signs in
  with their Home Assistant account, and balances can show up as sensors.
url: https://github.com/sameerkotra/ha-apps
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cash-multiple
panel_title: Splitpot
panel_admin: false
# Lets the app read person.* entities, publish balance sensors and exchange the
# household apps' messages (the Household Assistant asks, when an admin allows
# it) via the Supervisor's Core API proxy (http://supervisor/core/api/,
# auto-injected SUPERVISOR_TOKEN). Nothing else is requested; the lines below spell out
# the (default) denials.
homeassistant_api: true
hassio_api: false
auth_api: false
docker_api: false
full_access: false
apparmor: true
environment:
  DATA_DIR: /data
  PORT: "8099"
# admin_users is the only app option. Sensor sync on/off, the sync
# interval and the currency are App settings (Admin -> App settings).
options:
  admin_users: []
schema:
  admin_users:
    - "str"

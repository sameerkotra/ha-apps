# Every app's tests, on each push and pull request (tools/run_tests.py runs the same suites locally).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # the Python each app's image uses (its Dockerfile)
        include:
          - { app: calorie_tracker, python: "3.12" }
          - { app: family_tree, python: "3.12" }
          - { app: finance, python: "3.13" }
          - { app: household_ai, python: "3.13" }
          - { app: household_ai_docker, python: "3.13" }
          - { app: household_arcade, python: "3.12" }
          - { app: household_assistant, python: "3.12" }
          - { app: household_chat, python: "3.12" }
          - { app: household_docs, python: "3.12" }
          - { app: household_todo, python: "3.12" }
          - { app: household_vault, python: "3.12" }
          - { app: receipt_price_intelligence, python: "3.13" }
          - { app: splitpot, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.app }}/requirements*.txt
      - uses: actions/setup-node@v4          # the browser code's own tests (node --test)
        with:
          node-version: "20"
      - name: System packages                 # what the images have: the PDF tools (Finance, Receipts) and time zones
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils tzdata
      - name: Install
        run: python -m pip install -r ${{ matrix.app }}/requirements-dev.txt
      - name: Test
        env:
          TZ: UTC
        run: python tools/run_tests.py ${{ matrix.app }}

  repository:
    name: repository-wide checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Shared code is in sync
        run: python tools/sync_common.py --check
      # these checks start several apps (cross-site guard, Docs with Chat and Todo), so they need all of them
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils tzdata
          python -m pip install $(for f in */requirements-dev.txt; do printf -- '-r %s ' "$f"; done)
      - name: Test
        env:
          TZ: UTC
        run: python tools/run_tests.py repository

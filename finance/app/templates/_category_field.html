{% import "_category_options.html" as catopt %}
<form class="category-form" method="post" action="transaction-category{% if acting_qs %}?{{ acting_qs }}{% endif %}">
    <input type="hidden" name="id" value="{{ t.id }}">
    <input type="hidden" name="next" value="{{ next_page or 'transactions' }}">
    <select name="category" class="category-select" aria-label="Category">
        {{ catopt.options(category_groups, t.category or "", income_first=(t.amount > 0 and t.account_type in ("checking", "savings"))) }}
    </select>
    <button type="submit" class="btn-secondary category-save">Save</button>
</form>

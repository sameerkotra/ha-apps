{% if t.review_status == "clean" %}
<form class="note-form" hx-post="transaction-note{% if acting_qs %}?{{ acting_qs }}{% endif %}" hx-target="this" hx-swap="outerHTML">
    <input type="hidden" name="id" value="{{ t.id }}">
    <input type="text" name="note" value="{{ t.note or '' }}" placeholder="Add a note&hellip;" maxlength="1000" class="note-input">
    <button type="submit" class="btn-secondary note-save">Save</button>
</form>
{% else %}
<span class="hint" title="Available once this transaction is fully imported — not currently flagged for review.">not yet reviewed</span>
{% endif %}
{% if note_error %}<p class="hint" style="color: var(--danger); margin-top: 0.3rem;">{{ note_error }}</p>{% endif %}

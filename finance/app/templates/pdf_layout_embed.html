<!DOCTYPE html>
{# Bare layout for the PDF viewer shown inside the Uploads page's modal: no navigation, same theme. #}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PDF{% endblock %}</title>
    <script src="static/common/theme-boot.js?v={{ app_version }}"></script>
    <link rel="stylesheet" href="static/common/themes.css?v={{ app_version }}">
    <link rel="stylesheet" href="static/style.css?v={{ app_version }}">
</head>
<body class="embed-body">
    <main class="embed-main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
